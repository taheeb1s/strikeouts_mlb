

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop projections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003DA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Props">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    /* Installed, the page runs edge to edge under the status bar and the
       home indicator, so keep content clear of both. Zero on desktop. */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
    /* Royal rail, black type on white. The blue carries the identity;
       black does the reading. Red is kept for one job only - marking a
       figure that falls short - so it never competes with the blue. */
    --paper:      #FFFFFF;
    --paper-warm: #EEF2FB;
    --rule:       #D6DCE8;
    --ink:        #111111;
    --ink-soft:   #5A5F68;
    --bar:        #002F8C;
    --bar-fade:   #9DB2DC;
    --pencil:     #C8102E;

    --royal:      #003DA5;
    --royal-soft: #B9C8E6;
    --on-royal:   #FFFFFF;

    --gutter: clamp(1rem, 4vw, 2.5rem);
    --row-pad: 0.95rem;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 96rem;
    margin: 0 auto;
    padding: clamp(1.4rem, 3.5vw, 2.4rem) var(--gutter) 5rem;
    display: grid;
    grid-template-columns: 13.5rem minmax(0, 1fr);
    gap: 0 clamp(1.6rem, 3.5vw, 3rem);
    align-items: start;
  }
  .rail {
    position: sticky; top: calc(1.2rem + env(safe-area-inset-top, 0px));
    background: var(--royal); color: var(--on-royal);
    padding: 1.1rem 1rem 1.3rem;
  }
  .main { min-width: 0; }

  @media (max-width: 62rem) {
    .sheet { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .rail { position: static; margin-bottom: 1.2rem; }
  }

  /* ---------- masthead ---------- */

  .railhead {
    padding-bottom: 0.8rem;
    border-bottom: 1px solid rgba(255,255,255,0.25);
  }
  .railhead h1 {
    margin: 0; font-size: 1.5rem; font-weight: 700;
    letter-spacing: -0.03em; line-height: 1;
  }
  .railhead .date {
    display: block; margin-top: 0.35rem;
    font-size: 0.82rem; color: var(--royal-soft); font-weight: 400;
  }

  .railnav { display: flex; flex-direction: column; margin: 0.9rem 0 0; }
  .railnav button {
    font: inherit; font-size: 0.95rem; font-weight: 500;
    color: var(--royal-soft); background: none; border: 0;
    border-left: 3px solid transparent;
    padding: 0.4rem 0 0.4rem 0.6rem; text-align: left; cursor: pointer;
  }
  .railnav button:hover { color: var(--on-royal); }
  .railnav button[aria-pressed="true"] {
    color: var(--on-royal); font-weight: 700;
    border-left-color: var(--on-royal);
  }
  .railnav button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }

  /* ---------- sortable tables ---------- */
  .dt { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .dt thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--paper); text-align: right;
    font-size: 0.72rem; font-weight: 600; color: var(--ink-soft);
    padding: 0.5rem 0.55rem; white-space: nowrap;
    border-bottom: 2px solid var(--ink); cursor: pointer; user-select: none;
  }
  .dt thead th:first-child { text-align: left; }
  .dt thead th:hover { color: var(--ink); }
  .dt thead th[aria-sort] { color: var(--ink); }
  .dt thead th[aria-sort]::after {
    content: "\2191"; margin-left: 0.3em; font-size: 0.8em; opacity: 0.75;
  }
  .dt thead th[aria-sort="descending"]::after { content: "\2193"; }
  .dt tbody td {
    padding: 0.5rem 0.55rem; text-align: right;
    border-bottom: 1px solid var(--rule);
    font-variant-numeric: tabular-nums;
  }
  .dt tbody td:first-child {
    text-align: left; font-weight: 600; letter-spacing: -0.01em;
  }
  .dt tbody tr { cursor: pointer; }
  .dt tbody tr:hover td { background: rgba(51,81,63,0.055); }
  .dt tbody tr[aria-selected="true"] td {
    background: var(--paper-warm);
    box-shadow: inset 3px 0 0 var(--pencil);
  }
  .dt .sub { display: block; font-weight: 400; font-size: 0.76rem;
             color: var(--ink-soft); }
  .dt .lead { font-weight: 700; }
  .dt-wrap { overflow-x: auto; }
  .dt-empty { padding: 2rem 0; color: var(--ink-soft); }

  /* ---------- detail drawer ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(16,32,28,0.32);
    opacity: 0; pointer-events: none; transition: opacity 160ms ease; z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(34rem, 92vw);
    background: var(--paper); z-index: 50;
    border-left: 3px solid var(--ink);
    transform: translateX(102%); transition: transform 190ms ease;
    overflow-y: auto; padding: 1.3rem clamp(1rem, 3vw, 1.7rem) 3rem;
    box-shadow: -14px 0 34px rgba(16,32,28,0.1);
  }
  .drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .scrim { transition: none; }
  }
  .drawer-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; padding-bottom: 0.7rem; margin-bottom: 1rem;
    border-bottom: 2px solid var(--ink);
  }
  .drawer-head h2 {
    margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .drawer-head .who2 { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.2rem; }
  .drawer-close {
    font: inherit; font-size: 1.4rem; line-height: 1; color: var(--ink-soft);
    background: none; border: 0; cursor: pointer; padding: 0 0.2rem;
  }
  .drawer-close:hover { color: var(--pencil); }

  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem,1fr));
        gap: 0.8rem 1rem; margin: 0 0 1.2rem; }
  .kv dt { font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 0.1rem; }
  .kv dd { margin: 0; font-size: 1.25rem; font-weight: 700;
           letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }

  /* ---------- live scoreboard ---------- */
  .sb { border-top: 2px solid var(--ink); }
  .sb-row {
    display: grid; grid-template-columns: minmax(0,1fr) 3.4rem;
    gap: 0 0.8rem; padding: 0.6rem 0; border-bottom: 1px solid var(--rule);
    align-items: center;
  }
  .sb-row .side {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.6rem; padding: 0.12rem 0; font-size: 0.95rem;
  }
  .sb-row .side .nm { white-space: nowrap; overflow: hidden;
                      text-overflow: ellipsis; }
  .sb-row .side .sc {
    font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.05rem;
  }
  .sb-row .side.win .nm { font-weight: 700; }
  .sb-row .side.lose { color: var(--ink-soft); }
  .sb-row .st { text-align: right; font-size: 0.76rem; color: var(--ink-soft);
                line-height: 1.3; }
  .sb-row .st .live {
    color: var(--pencil); font-weight: 700; display: block;
  }
  .sb-row .st .final { font-weight: 600; color: var(--ink); }
  .sb-note { font-size: 0.82rem; color: var(--ink-soft); padding: 1.4rem 0; }
  .sb-stale { font-size: 0.76rem; color: var(--ink-soft); margin-top: 0.8rem; }

  /* ---------- dashboard home ---------- */
  .home { display: grid; gap: 1rem;
          grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
  .tile {
    border-top: 3px solid var(--ink); padding: 0.8rem 0 1rem;
    display: flex; flex-direction: column; cursor: pointer;
    background: none; border-left: 0; border-right: 0; border-bottom: 0;
    text-align: left; font: inherit; color: inherit;
  }
  .tile:hover { border-top-color: var(--pencil); }
  .tile:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; }
  .tile h3 { margin: 0; font-size: 1.05rem; font-weight: 700;
             letter-spacing: -0.02em; }
  .tile .live { margin: 0.15rem 0 0.7rem; font-size: 0.82rem; color: var(--ink-soft); }
  .tile .top { font-size: 0.86rem; }
  .tile .top div {
    display: flex; justify-content: space-between; gap: 0.6rem;
    padding: 0.2rem 0; border-bottom: 1px solid var(--rule);
  }
  .tile .top b { font-variant-numeric: tabular-nums; }
  .tile .verdict {
    margin-top: auto; padding-top: 0.7rem; font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .tile .verdict .good { color: var(--bar); font-weight: 700; }
  .tile .verdict .bad { color: var(--pencil); font-weight: 700; }
  .tile .idle { font-size: 0.84rem; color: var(--ink-soft); padding: 0.4rem 0 0; }

  .railgroup { margin-top: 1.3rem; }
  .railgroup h2 {
    margin: 0 0 0.3rem; font-size: 0.74rem; font-weight: 600;
    color: var(--royal-soft); letter-spacing: 0;
  }

  .onnow { margin: 1.3rem 0 0; }
  .onnow .cell {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0.22rem 0; font-size: 0.82rem; color: var(--royal-soft);
    border-bottom: 1px solid rgba(255,255,255,0.16);
  }
  .onnow .cell b {
    color: var(--on-royal); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .onnow .none { font-size: 0.8rem; color: var(--royal-soft); }

  @media (max-width: 62rem) {
    .railnav { flex-direction: row; flex-wrap: wrap; gap: 0 0.9rem; }
    .railnav button {
      border-left: 0; border-bottom: 3px solid transparent;
      padding: 0.35rem 0 0.4rem;
    }
    .railnav button[aria-pressed="true"] {
      border-left-color: transparent; border-bottom-color: var(--pencil);
    }
    .onnow { display: flex; flex-wrap: wrap; gap: 0 1.4rem; }
    .onnow .cell { border-bottom: 0; gap: 0.35rem; }
  }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1.5rem;
    padding-bottom: 0.9rem;
    border-bottom: 2px solid var(--ink);
  }

  .masthead h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.05;
  }

  .railhead .date {
    display: block;
    font-size: clamp(0.9rem, 2.2vw, 1.05rem);
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0;
    margin-top: 0.25rem;
  }

  .meta {
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-align: right;
  }

  /* ---------- notice ---------- */

  .notice {
    margin-top: 1.25rem;
    padding: 0.7rem 0.95rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--pencil);
    font-size: 0.88rem;
    color: var(--ink);
  }
  .notice code {
    font-family: inherit;
    font-weight: 600;
    background: rgba(27, 39, 51, 0.07);
    padding: 0.05em 0.35em;
    border-radius: 2px;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 0.1rem 0.75rem;
    margin: 1.2rem 0 0; font-size: 0.85rem; color: var(--royal-soft);
  }
  .controls > span[aria-hidden] { display: none; }
  .controls > span:first-child {
    flex: 0 0 100%; font-size: 0.74rem; font-weight: 600;
    color: var(--royal-soft); margin-bottom: 0.15rem;
  }

  .controls button {
    font: inherit; font-weight: 500; color: var(--royal-soft);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 0.15rem 0.1rem; cursor: pointer;
  }
  .controls button:hover { color: var(--on-royal); }
  .controls button[aria-pressed="true"] {
    color: var(--on-royal); font-weight: 700;
    border-bottom-color: var(--on-royal);
  }
  .controls button:focus-visible {
    outline: 2px solid var(--pencil);
    outline-offset: 3px;
  }

  /* ---------- ledger ---------- */

  .ledger { border-top: 1px solid var(--ink); }

  .entry { border-bottom: 1px solid var(--rule); }

  .entry-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 0 1.1rem;
    width: 100%;
    padding: var(--row-pad) 0;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .entry-head:hover { background: rgba(51, 81, 63, 0.045); }
  .entry-head:focus-visible {
    outline: 2px solid var(--pencil);
    outline-offset: -2px;
  }

  .who { min-width: 0; }

  .name {
    font-size: clamp(1rem, 2.6vw, 1.18rem);
    font-weight: 600;
    letter-spacing: -0.012em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .matchup {
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .proj {
    font-size: clamp(1.5rem, 4.2vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
    text-align: right;
    font-feature-settings: "tnum";
  }

  .strip { display: block; }

  /* ---------- detail ---------- */

  .detail {
    display: none;
    padding: 0.35rem 0 1.6rem;
  }
  .entry[open-detail] .detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 1.1rem 1.5rem;
    padding: 1.1rem 0 1.4rem;
    border-top: 1px dashed var(--rule);
  }

  .fact dt {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0 0 0.15rem;
  }
  .fact dd {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .bet { margin: 0 0 1.2rem; }
  .bet-row {
    display: grid;
    grid-template-columns: 4.6rem 3.4rem 4.4rem 1fr;
    align-items: baseline; gap: 0 0.7rem;
    padding: 0.4rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.9rem;
  }
  .bet-row.head {
    font-size: 0.72rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--ink); padding-bottom: 0.3rem;
  }
  .bet-row .p { text-align: right; font-weight: 600; }
  .bet-row .fair { text-align: right; font-weight: 700;
                   font-variant-numeric: tabular-nums; }
  .bet-row .note { font-size: 0.8rem; color: var(--ink-soft); }
  .bet-row .good { color: var(--pencil); font-weight: 600; }
  .bet-row.atline { background: var(--paper-warm); }

  .chart-wrap { margin: 0.4rem 0 1.3rem; }

  .market {
    padding: 0.75rem 0.95rem;
    margin: 0 0 1.2rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--pencil);
    font-size: 0.9rem;
  }
  .market-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.3rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  .market-top .book {
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .market-top .juice { color: var(--ink-soft); font-size: 0.84rem; }
  .market-lines {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.3rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  .market .ev { margin-left: auto; font-weight: 600; }
  .market .ev.pos { color: var(--pencil); }
  .market .ev.neg { color: var(--ink-soft); }
  .market-cmp {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.3rem;
  }
  .market b { font-weight: 600; }
  .market .gap { margin-left: auto; color: var(--pencil); font-weight: 600; }
  .market .none { color: var(--ink-soft); }

  .caption {
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0 0 1rem;
  }

  /* ---------- empty ---------- */

  .empty {
    padding: 3.5rem 0 2rem;
    max-width: 44ch;
  }
  .empty h2 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.6rem;
  }
  .empty p { margin: 0 0 0.9rem; color: var(--ink-soft); }
  .empty pre {
    font-family: inherit;
    font-weight: 600;
    background: var(--paper-warm);
    padding: 0.7rem 0.9rem;
    margin: 0;
    overflow-x: auto;
    font-size: 0.9rem;
  }

  .card {
    margin: 1.6rem 0 0;
    padding: 0.9rem 1.05rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--bar);
  }
  .card h2 {
    margin: 0 0 0.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.4rem;
    font-size: 0.88rem;
  }
  .card-row + .card-row { margin-top: 0.35rem; }
  .card b { font-weight: 600; }
  .card .note {
    margin: 0.6rem 0 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 56ch;
  }
  .card .headline { color: var(--pencil); font-weight: 600; }

  /* --- view switch --- */
  .views {
    display: flex; align-items: baseline; gap: 0.4rem;
    margin: 1.4rem 0 0; font-size: 0.85rem; color: var(--ink-soft);
  }
  .views button {
    font: inherit; font-weight: 500; color: var(--ink-soft);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 0.15rem 0.1rem; cursor: pointer;
  }
  .views button:hover { color: var(--ink); }
  .views button[aria-pressed="true"] {
    color: var(--ink); font-weight: 600; border-bottom-color: var(--pencil);
  }
  .views button:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; }

  /* --- results --- */
  .res { border-top: 1px solid var(--ink); margin-top: 0.4rem; }
  .res-day {
    padding: 0.75rem 0 0.3rem; font-size: 0.82rem;
    font-weight: 600; color: var(--ink-soft);
  }
  .res-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.2rem 3.2rem 3.4rem auto;
    align-items: baseline; gap: 0 0.7rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.92rem;
  }
  .res-row .nm {
    font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .res-row .n { text-align: right; font-variant-numeric: tabular-nums; }
  .res-row .got { font-weight: 700; }
  .res-row .miss { color: var(--ink-soft); }
  .res-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.2rem 3.2rem 3.4rem auto;
    gap: 0 0.7rem; padding: 0.4rem 0;
    font-size: 0.74rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--rule);
  }
  .res-head span:not(:first-child) { text-align: right; }
  .tag {
    font-size: 0.72rem; font-weight: 600; padding: 0.05rem 0.4rem;
    background: var(--paper-warm); white-space: nowrap;
  }
  .tag.win { background: var(--bar); color: var(--paper); }
  @media (max-width: 34rem) {
    .res-row, .res-head { grid-template-columns: minmax(0,1fr) 2.7rem 2.7rem auto; }
    .res-row .bf, .res-head .bf { display: none; }
  }

  .calc {
    margin: 2rem 0 0;
    padding: 1.05rem 1.15rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--ink);
  }
  .calc h2 {
    margin: 0 0 0.15rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .calc .sub {
    margin: 0 0 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 54ch;
  }
  .calc-in {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 0.9rem;
    align-items: flex-end;
  }
  .fld { display: flex; flex-direction: column; gap: 0.2rem; }
  .fld label { font-size: 0.76rem; color: var(--ink-soft); }
  .fld input, .fld select {
    font: inherit;
    font-size: 0.92rem;

/* ---------- helpers ---------- */

const fmt1 = n => n.toFixed(1);

function gameTime(s) {
  // Prefer the raw timestamp so the browser shows it in the viewer's zone.
  if (s.start_iso) {
    const d = new Date(s.start_iso);
    if (!isNaN(d)) return d.toLocaleTimeString(undefined,
      { hour: "numeric", minute: "2-digit" });
  }
  return s.game_time || "";
}

function startMs(s) {
  if (s.start_iso) {
    const t = Date.parse(s.start_iso);
    if (!isNaN(t)) return t;
  }
  return Number.MAX_SAFE_INTEGER;   // undated games sort last, not first
}
const pct = n => Math.round(n * 100) + "%";

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });
}

// Inverse normal CDF (Acklam's rational approximation, ~1e-9 accurate).
// Needed to turn the market's probability back into a projected total.
function probit(p) {
  if (p <= 0 || p >= 1) return NaN;
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
             1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
             6.680131188771972e+01, -1.328068155288572e+01];
  const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
             -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
             3.754408661907416e+00];
  const pl = 0.02425, ph = 1 - pl;
  let q, r;
  if (p < pl) {
    q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  if (p > ph) {
    q = Math.sqrt(-2 * Math.log(1 - p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
            ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  q = p - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5]) * q /
         (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

function pmfSd(pmf) {
  let m = 0, m2 = 0;
  for (let i = 0; i < pmf.length; i++) { m += i * pmf[i]; m2 += i * i * pmf[i]; }
  return Math.sqrt(Math.max(0, m2 - m * m));
}

// What total is the market projecting? Invert its own probability against
// the line, using this pitcher's spread rather than a league-wide one.
function impliedMean(line, pOver, sd) {
  if (!(sd > 0) || !(pOver > 0.02) || !(pOver < 0.98)) return null;
  return line + sd * probit(pOver);
}

function tailProb(pmf, n) {
  let s = 0;
  for (let i = n; i < pmf.length; i++) s += pmf[i];
  return s;
}

/* ---------- distribution graphics ---------- */

// Compact strip shown on every row. Red tick marks the projection.
function strip(pmf, mean, line) {
  const W = 168, H = 40, n = MAX_K + 1, bw = W / n, peak = Math.max(...pmf);
  let bars = "";
  for (let i = 0; i < n; i++) {
    const h = Math.max(1, (pmf[i] / peak) * (H - 6));
    bars += `<rect x="${(i * bw + 0.6).toFixed(2)}" y="${(H - h).toFixed(2)}" ` +
            `width="${(bw - 1.2).toFixed(2)}" height="${h.toFixed(2)}" fill="var(--bar)" ` +
            `opacity="${(0.35 + 0.65 * (pmf[i] / peak)).toFixed(2)}"/>`;
  }
  const x = (mean + 0.5) * bw;
  let book = "";
  if (line != null) {
    const lx = (line + 1) * bw;
    book = `<line x1="${lx.toFixed(2)}" y1="0" x2="${lx.toFixed(2)}" y2="${H}" ` +
           `stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 2" opacity="0.65"/>`;
  }
  return `<svg class="strip" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ` +
         `role="img" aria-label="Distribution of likely strikeout totals">` +
         bars + book +
         `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${H}" ` +
         `stroke="var(--pencil)" stroke-width="1.5"/></svg>`;
}

// Full chart shown when a row is expanded.
function chart(pmf, mean, line) {
  const W = 560, H = 150, AX = 22, n = MAX_K + 1;
  const bw = W / n, peak = Math.max(...pmf), plot = H - AX;
  let bars = "", ticks = "";
  for (let i = 0; i < n; i++) {
    const h = Math.max(1, (pmf[i] / peak) * (plot - 8));
    bars += `<rect x="${(i * bw + 1).toFixed(2)}" y="${(plot - h).toFixed(2)}" ` +
            `width="${(bw - 2).toFixed(2)}" height="${h.toFixed(2)}" ` +
            `fill="var(--bar)" opacity="${(0.3 + 0.7 * (pmf[i] / peak)).toFixed(2)}"/>`;
    if (i % 2 === 0) {
      ticks += `<text x="${(i * bw + bw / 2).toFixed(2)}" y="${H - 6}" ` +
               `text-anchor="middle" font-size="11" fill="var(--ink-soft)">${i}</text>`;
    }
  }
  const x = (mean + 0.5) * bw;
  let book = "";
  if (line != null) {
    const lx = (line + 1) * bw;
    book = `<line x1="${lx.toFixed(2)}" y1="0" x2="${lx.toFixed(2)}" y2="${plot}" ` +
           `stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>`;
  }
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" ` +
         `role="img" aria-label="Probability of each strikeout total">` +
         bars + book +
         `<line x1="0" y1="${plot}" x2="${W}" y2="${plot}" stroke="var(--rule)"/>` +
         `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${plot}" ` +
         `stroke="var(--pencil)" stroke-width="1.5"/>` +
         ticks + `</svg>`;
}

/* ---------- rendering ---------- */

// The price at which a given probability is exactly fair.
function fairPrice(p) {
  if (!(p > 0.005) || !(p < 0.995)) return null;
  return p >= 0.5 ? -Math.round(100 * p / (1 - p))
                  : Math.round(100 * (1 - p) / p);
}

function breakEvenTable(s) {
  const base = Math.round(s.proj_k);
  const lo = Math.max(1, base - 2), hi = base + 2;
  const m = s.market;
  const mktThresh = m ? Math.floor(m.line) + 1 : null;

  const rows = [];
  for (let n = lo; n <= hi; n++) {
    const p = tailProb(s.pmf, n);
    const fp = fairPrice(p);
    if (fp == null) continue;
    const atLine = n === mktThresh;

    let note = "";
    if (atLine && m) {
      const offered = m.best_over.price;
      const better = toDecimal(offered) > toDecimal(fp);
      note = better
        ? `<span class="good">${m.best_over.book} pays
           ${offered > 0 ? "+" : ""}${offered} — better than fair</span>`
        : `<span class="note">best offered
           ${offered > 0 ? "+" : ""}${offered} at ${m.best_over.book}</span>`;
    }

    rows.push(`<div class="bet-row${atLine ? " atline" : ""}">
      <span>${n} or more</span>
      <span class="p">${(p * 100).toFixed(0)}%</span>
      <span class="fair">${fp > 0 ? "+" : ""}${fp}</span>
      <span>${note}</span>
    </div>`);
  }

  return `<div class="bet">
    <div class="bet-row head">
      <span>Threshold</span><span class="p">Chance</span>
      <span class="fair">Fair price</span><span></span>
    </div>
    ${rows.join("")}
  </div>
  <p class="caption">Fair price is what each threshold is worth if my
    numbers are right — take anything better, pass on anything worse.
    ${m ? "The shaded row is where the book set its line." : ""}
    These follow from the distribution above, so they're only as good
    as it is.</p>`;
}

function detail(s) {
  const m = s.market;
  const price = p => (p > 0 ? "+" : "") + p;
  const evPct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + "%";
  const best = m && (m.best_side === "Over" ? m.best_over : m.best_under);

  const mkt = m
    ? `<div class="market">
         <div class="market-lines">
           <span>Market line <b>${m.line}</b></span>
           <span>Market projects
             <b>${(() => { const im = impliedMean(m.line, m.consensus_over, pmfSd(s.pmf));
                  return im == null ? "—" : im.toFixed(1); })()}</b></span>
           <span>I project <b>${s.proj_k.toFixed(1)}</b></span>
           <span class="juice">${m.books} book${m.books === 1 ? "" : "s"},
             ${pct(m.avg_vig)} margin${m.book_spread > 0.05
               ? `, disagreeing by ${Math.round(m.book_spread * 100)} pts` : ""}</span>
         </div>
         <div class="market-top">
           <span>Market <b>${pct(m.consensus_over)}</b></span>
           <span>This model <b>${pct(m.model_over)}</b></span>
           <span class="gap">${m.edge > 0 ? "+" : ""}${Math.round(m.edge * 100)} pts</span>
         </div>
         <div class="market-cmp">
           <span>Best ${m.best_side.toLowerCase()} <b>${price(best.price)}</b>
             at ${best.book}</span>
           <span class="ev ${m.best_ev > 0 ? "pos" : "neg"}">${evPct(m.best_ev)} by my numbers</span>
         </div>
       </div>`
    : `<div class="market"><span class="none">No strikeout line posted for this start.</span></div>`;

  return `
    <div class="detail">
      ${whyLine(s)}
      ${formFlags(s.pitcher)}
      ${weatherLine(s)}
      <div class="chart-wrap">${chart(s.pmf, s.proj_k, m ? m.line : null)}</div>
      ${mkt}
      ${m ? `<p class="caption">Both percentages are the chance of clearing
        ${m.line}, with the books' margin stripped out so they're comparable.
        The last figure is what my numbers say that price is worth — which is
        only as good as the model, and the model hasn't been graded yet.</p>` : ""}
      <p class="caption">Height is the chance of that exact total. The red line is
      the projection${m ? ", the dashed line is the book's" : ""} — note how little
      of the distribution actually sits on any one number.</p>
      ${breakEvenTable(s)}
      <dl class="detail-grid">
        <div class="fact"><dt>Batters faced</dt><dd>${fmt1(s.proj_bf)}</dd></div>
        <div class="fact"><dt>Matchup K rate</dt><dd>${pct(s.k_rate)}</dd></div>
        <div class="fact"><dt>His K rate</dt><dd>${pct(s.pitcher_k_pct)}</dd></div>
        <div class="fact"><dt>Their K rate</dt><dd>${pct(s.opp_k_pct)}</dd></div>
        <div class="fact"><dt>Lineup</dt><dd>${s.lineup_confirmed ? "Posted" : "Projected"}</dd></div>
      </dl>
    </div>`;
}

function weatherLine(s) {
  const w = s.weather;
  if (!w) return "";
  if (w.indoor) {
    return `<div class="wx"><span class="t">Indoors</span>
      <span class="note">${w.roof || "Dome"} — weather isn't a factor</span></div>`;
  }
  const bits = [];
  if (w.temp_f != null) bits.push(`<span class="t">${w.temp_f}&deg;F</span>`);
  if (w.wind) bits.push(`<span>Wind ${w.wind}${w.wind_dir ? " " + w.wind_dir : ""}</span>`);
  if (w.conditions) bits.push(`<span>${w.conditions}</span>`);
  if (w.rain_pct != null && w.rain_pct >= 30)
    bits.push(`<span class="note">${w.rain_pct}% rain</span>`);
  if (!bits.length) return "";
  bits.push(`<span class="note">shown for context — not in the projection</span>`);
  return `<div class="wx">${bits.join("")}</div>`;
}

/* ---------- parlays ---------- */

function amFromDec(d) {
  return d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1));
}

function legsFor(d) {
  // Only pitchers with a market, and only the side the model prefers.
  return d.starters.filter(s => s.market && s.market.best_ev != null)
    .map(s => {
      const m = s.market;
      const over = m.best_side === "Over";
      const best = over ? m.best_over : m.best_under;
      return {
        pitcher: s.pitcher, team: s.team, opponent: s.opponent,
        side: m.best_side, line: m.line, price: best.price, book: best.book,
        dec: toDecimal(best.price),
        mine: over ? m.model_over : 1 - m.model_over,
        mkt: over ? m.consensus_over : 1 - m.consensus_over,
        ev: m.best_ev,
      };
    })
    .sort((a, b) => b.ev - a.ev);
}

function sameGame(a, b) {
  return (a.team === b.opponent && a.opponent === b.team);
}

function buildSlip(legs, stake) {
  const dec = legs.reduce((x, l) => x * l.dec, 1);
  const mine = legs.reduce((x, l) => x * l.mine, 1);
  const mkt = legs.reduce((x, l) => x * l.mkt, 1);
  const be = 1 / dec;
  const ev = mine * (dec - 1) - (1 - mine);
  // Fair price if the books took no margin, from their own devigged numbers.
  const fairDec = 1 / mkt;
  const hold = 1 - dec / fairDec;
  const b = dec - 1;
  const kelly = Math.max(0, (mine * b - (1 - mine)) / b);
  // Same sum, if the model is 5 points pessimistic on each leg.
  const shaded = legs.reduce((x, l) => x * Math.max(0.02, l.mine - 0.05), 1);
  const kellyLow = Math.max(0, (shaded * b - (1 - shaded)) / b);

  const clash = legs.some((l, i) => legs.slice(i + 1).some(o => sameGame(l, o)));

  return `<div class="slip">
    <div class="n">${legs.length} leg${legs.length === 1 ? "" : "s"}</div>
    ${legs.map(l => `<div class="leg">
      <span class="who">${l.pitcher}</span>
      <span>${l.side} ${l.line}</span>
      <span>${l.price > 0 ? "+" : ""}${l.price}</span>
      <span class="bk">${l.book}</span>
    </div>`).join("")}
    <div class="tot">
      <span>Pays <b>${amFromDec(dec) > 0 ? "+" : ""}${amFromDec(dec)}</b></span>
      <span>$${stake} returns <b>$${(stake * dec).toFixed(2)}</b></span>
      <span>Needs <b>${(be * 100).toFixed(1)}%</b></span>
      <span>My model <b>${(mine * 100).toFixed(1)}%</b></span>
    </div>
    <div class="cost">The books' margin on this combination is
      <b>${(hold * 100).toFixed(1)}%</b> — that's what the parlay costs you
      versus the same legs bet singly.</div>
    <div class="cost">Kelly would stake ${(kelly * 100).toFixed(1)}% of your
      bankroll on my numbers — but only ${(kellyLow * 100).toFixed(1)}% if each
      leg is 5 points worse than I think. That swing is the point.</div>
    ${clash ? `<div class="warn">Two legs are in the same game. Their outcomes
      move together, so the combined probability above is overstated.</div>` : ""}
  </div>`;
}

function parlayPanel() {
  const d = state.data;
  if (!d) return "";
  const legs = legsFor(d);
  if (legs.length < 2) {
    return `<div class="par"><h2>Parlays</h2>
      <p class="sub">Needs at least two pitchers with posted lines. Once the
      board fills in, suggestions appear here.</p></div>`;
  }

  const stake = state.stake || 10;

  // Enumerate every valid combination of 2 to 4 legs, score by combined EV,
  // then pick five with a cap on how often any one leg reappears - otherwise
  // the top five are all the same pitcher with a rotating partner.
  const pool = legs.slice(0, 10);
  const combos = [];
  const walk = (start, chosen) => {
    if (chosen.length >= 2 && chosen.length <= 3) {
      const dec = chosen.reduce((x, l) => x * l.dec, 1);
      const mine = chosen.reduce((x, l) => x * l.mine, 1);
      combos.push({ legs: [...chosen], ev: mine * (dec - 1) - (1 - mine) });
    }
    if (chosen.length === 3) return;
    for (let i = start; i < pool.length; i++) {
      if (chosen.some(c => sameGame(c, pool[i]))) continue;
      chosen.push(pool[i]);
      walk(i + 1, chosen);
      chosen.pop();
    }
  };
  walk(0, []);
  combos.sort((a, b) => b.ev - a.ev);

  // Ranking purely by EV always picks the longest slip available, because
  // positive-EV legs multiply. That finds longer bets, not better ones. So
  // fill a fixed shape instead: two doubles, three trebles.
  const MAX_REUSE = 3;
  const used = {};
  const picked = [];
  const take = (size, want) => {
    let n = 0;
    for (const c of combos) {
      if (n >= want) break;
      if (c.legs.length !== size) continue;
      if (c.legs.some(l => (used[l.pitcher] || 0) >= MAX_REUSE)) continue;
      picked.push(c);
      c.legs.forEach(l => { used[l.pitcher] = (used[l.pitcher] || 0) + 1; });
      n++;
    }
    return n;
  };
  const got2 = take(2, 2);
  const got3 = take(3, 3);
  // Backfill if one size ran short on a thin board.
  if (picked.length < 5) take(2, 5 - picked.length);
  if (picked.length < 5) take(3, 5 - picked.length);
  picked.sort((a, b) => a.legs.length - b.legs.length || b.ev - a.ev);
  const slips = picked.map(c => buildSlip(c.legs, stake));

  return `<div class="par">
    <h2>Suggested parlays</h2>
    <p class="sub">Two doubles and three trebles, best available price on
      each, no leg used more than three times. Sizes are fixed deliberately:
      ranking by EV alone always picks the longest slip, because positive-EV
      legs multiply — that finds longer bets, not better ones. The model
      beats a season average by 0.04 strikeouts and has never been tested
      against a book, and errors compound with every leg you add.</p>
    <div class="stake">
      <label for="stk">Stake $</label>
      <input id="stk" type="number" min="1" step="1" value="${stake}">
    </div>
    ${slips.join("")}
  </div>`;
}

function formFlags(name) {
  const past = ((state.card && state.card.results) || [])
    .filter(r => r.pitcher === name).slice(0, 5);
  if (past.length < 3) return "";
  const flags = [];

  // Which side of the projection have recent starts landed on?
  const last3 = past.slice(0, 3);
  if (last3.every(r => r.actual > r.proj))
    flags.push(`<span class="flag hot">Beat the projection 3 straight</span>`);
  else if (last3.every(r => r.actual < r.proj))
    flags.push(`<span class="flag cold">Fell short 3 straight</span>`);

  // Workload direction - the thing that caps or raises the ceiling.
  const bfs = past.filter(r => r.bf).map(r => r.bf);
  if (bfs.length >= 4) {
    const recent = (bfs[0] + bfs[1]) / 2;
    const older = bfs.slice(2).reduce((a, b) => a + b, 0) / bfs.slice(2).length;
    if (recent - older >= 2.5)
      flags.push(`<span class="flag hot">Going deeper lately —
        ${recent.toFixed(0)} batters vs ${older.toFixed(0)}</span>`);
    else if (older - recent >= 2.5)
      flags.push(`<span class="flag cold">Shorter outings lately —
        ${recent.toFixed(0)} batters vs ${older.toFixed(0)}</span>`);
  }

  // Raw strikeout form.
  const ks = past.map(r => r.actual);
  const hi = Math.max(...ks), lo = Math.min(...ks);
  if (hi - lo >= 6)
    flags.push(`<span class="flag">Volatile — ${lo} to ${hi} over
      ${past.length} starts</span>`);

  return flags.length ? `<div class="form">${flags.join("")}</div>` : "";
}

function gapCell(s) {
  const m = s.market;
  if (!m) return `<span class="gap flat">—</span>`;
  const pts = Math.round(m.edge * 100);
  const ev = m.best_ev;

  // The number is direction: plus means the model likes the over, minus the
  // under. The colour is value: green where the best available price beats
  // what the model thinks it's worth, red where it doesn't.
  let cls = "gap ";
  if (ev == null) cls += "flat";
  else if (ev >= 0.05) cls += "take";
  else if (ev <= -0.02) cls += "avoid";
  else cls += "flat";
  if (Math.abs(pts) >= 15) cls += " wide";

  const side = pts > 0 ? "over" : "under";
  let title = ev == null ? "No price to judge"
    : ev >= 0.05
      ? `Best ${side} price is worth ${Math.round(ev * 100)}% by the model`
      : ev <= -0.02
        ? `Best ${side} price is ${Math.round(-ev * 100)}% short of fair`
        : "Roughly fair — no value either way";
  if (Math.abs(pts) >= 15)
    title += ". Marked * because a gap this wide has usually been the model"
           + " missing something, not the book being wrong.";

  return `<span class="${cls}" title="${title}">${pts > 0 ? "+" : ""}${pts}</span>`;
}

function compactView(rows) {
  return `<div class="cmp">
    <div class="cmp-head">
      <span>Pitcher</span><span class="vsh">Matchup</span>
      <span>Proj</span><span>Line</span><span class="mkh">Market</span><span>Gap</span>
    </div>
    ${rows.map(s => {
      const m = s.market;
      return `<div class="cmp-row" data-pitcher="${s.pitcher}">
        <span class="nm">${s.pitcher}</span>
        <span class="vs">${s.team} ${s.home ? "vs" : "at"} ${s.opponent}</span>
        <span class="n pj">${fmt1(s.proj_k)}</span>
        <span class="n">${m ? m.line : "—"}</span>
        <span class="n mk">${m ? pct(m.consensus_over) : "—"}</span>
        ${gapCell(s)}
      </div>`;
    }).join("")}
  </div>
  <p class="cal-key" style="margin-top:0.6rem">Gap is model minus market:
    plus means it likes the over, minus the under. Colour is the price —
    <b style="color:var(--bar)">green</b> where the best available number
    beats what the model thinks it's worth,
    <b style="color:var(--pencil)">red</b> where it falls short, grey where
    it's roughly fair. A <b>*</b> marks gaps over 15 points, which have so
    far been where this model is least accurate.</p>`;
}

function matchupView(rows) {
  // Pair starters who face each other; leave singletons on their own card.
  const used = new Set();
  const games = [];
  for (const a of rows) {
    if (used.has(a.pitcher)) continue;
    const b = rows.find(x => !used.has(x.pitcher) && x !== a
      && x.team === a.opponent && x.opponent === a.team);
    used.add(a.pitcher);
    if (b) used.add(b.pitcher);
    const away = a.home ? (b || null) : a;
    const home = a.home ? a : (b || null);
    games.push({ away, home, venue: a.venue, when: gameTime(a),
                 key: [a.team, a.opponent].sort().join("") });
  }
  games.sort((x, y) => startMs(x.home || x.away) - startMs(y.home || y.away));

  const PA_PER_GAME = 38;   // roughly a team's plate appearances in nine innings
  const lg = (state.data && state.data.league_k_pct) || 0.223;
  const lgGame = lg * PA_PER_GAME;

  // The two numbers behind the projection, in units you can compare:
  // what he does to a neutral lineup, and what they do against neutral pitching.
  const versus = s => {
    if (!s || s.pitcher_k_pct == null || s.opp_k_pct == null) return "";
    const his = s.pitcher_k_pct * (s.proj_bf || 23);
    const theirs = s.opp_k_pct * PA_PER_GAME;
    const hot = theirs > lgGame * 1.08 ? " hot" : "";
    const cold = theirs < lgGame * 0.92;
    return `<div class="mu-vs">
      <span class="lhs"><span class="num">${his.toFixed(1)}</span> K a start</span>
      <span class="mid">VS</span>
      <span class="rhs"><span class="num${hot}">${theirs.toFixed(1)}</span>
        ${s.opponent} K a game</span>
    </div>
    <div class="mu-vs" style="padding-top:0;grid-template-columns:1fr">
      <span class="lhs">${hot ? `${s.opponent} strike out more than most`
        : cold ? `${s.opponent} are a tough, contact-heavy lineup`
        : `league average is ${lgGame.toFixed(1)} a game`}</span>
    </div>`;
  };

  const side = s => s
    ? `<div class="mu-side" data-pitcher="${s.pitcher}">
         <span><span class="nm">${s.pitcher}</span>
           <span class="t">${s.team}</span></span>
         <span class="n pj">${fmt1(s.proj_k)}</span>
         <span class="n">${s.market ? s.market.line : "—"}</span>
       </div>${versus(s)}`
    : `<div class="tbd">Starter not posted</div>`;

  return `<div class="mu">${games.map(g => `
    <div class="mu-card">
      <div class="g">${(g.away && g.away.team) || "?"} at
        ${(g.home && g.home.team) || "?"} · ${g.when}</div>
      ${side(g.away)}${side(g.home)}
    </div>`).join("")}</div>`;
}

function whyLine(s) {
  const lg = (state.data && state.data.league_k_pct) || 0.223;
  const bits = [];

  const pk = s.pitcher_k_pct, ok = s.opp_k_pct;
  const pRel = pk / lg, oRel = ok / lg;

  bits.push(pRel > 1.25 ? `<b>${s.pitcher}</b> strikes out far more hitters than average`
    : pRel > 1.08 ? `<b>${s.pitcher}</b> runs a better-than-average strikeout rate`
    : pRel < 0.8 ? `<b>${s.pitcher}</b> is well below average at missing bats`
    : `<b>${s.pitcher}</b> is around league average at missing bats`);

  bits.push(oRel > 1.12 ? `${s.opponent} strike out a lot`
    : oRel < 0.9 ? `${s.opponent} are a tough, contact-heavy lineup`
    : `${s.opponent} are about average in that respect`);

  const bf = s.proj_bf;
  bits.push(bf >= 25.5 ? `and he's been going deep — about ${bf.toFixed(0)} batters a start`
    : bf <= 21 ? `but he's only facing about ${bf.toFixed(0)} batters a start, which caps the ceiling`
    : `facing roughly ${bf.toFixed(0)} batters a start`);

  let txt = bits[0] + ", " + bits[1] + ", " + bits[2] + ".";

  if (s.starts_ytd != null && s.starts_ytd < 5) {
    txt += ` Only ${s.starts_ytd} start${s.starts_ytd === 1 ? "" : "s"} on record,
             so this leans heavily on league average.`;
  }
  const m = s.market;
  if (m && Math.abs(m.edge) > 0.15) {
    txt += ` The books disagree by ${Math.round(Math.abs(m.edge) * 100)} points —
             usually a sign the model is missing something they know.`;
  }
  return `<p class="why">${txt}</p>`;
}

function recordBlock() {
  const rows = ((state.card && state.card.results) || [])
    .filter(r => r.line != null && r.hit != null);
  if (rows.length < 3) return "";

  const w = rows.filter(r => r.hit).length;
  const l = rows.length - w;
  const pct_ = w / rows.length;

  // Does the model do better when it disagrees more? That's the question
  // the EV column keeps implying an answer to.
  const bands = [
    [0, 0.08, "under 8 pts"],
    [0.08, 0.15, "8 to 15"],
    [0.15, 9, "over 15"],
  ].map(([lo, hi, label]) => {
    const s = rows.filter(r => Math.abs(r.edge || 0) >= lo
                            && Math.abs(r.edge || 0) < hi);
    if (!s.length) return null;
    const sw = s.filter(r => r.hit).length;
    return `${label} <b>${sw}&ndash;${s.length - sw}</b>`;
  }).filter(Boolean);

  return `<div class="rec">
    <span><span class="big">${w}&ndash;${l}</span>
      <span class="lbl">record</span></span>
    <span><span class="pctg">${(pct_ * 100).toFixed(1)}%</span>
      <span class="lbl">of sides hit</span></span>
    ${bands.length ? `<span class="split">by size of disagreement<br>
      ${bands.join(" · ")}</span>` : ""}
  </div>
  <p class="cal-key">A side counts as a hit when the pitcher landed on the
    side the model preferred. ${rows.length < 100
      ? `At ${rows.length} graded sides this is still mostly noise — a coin
         flip lands outside 45-55% surprisingly often at this count.`
      : `Break-even against a standard price is about 52.4%, so that's the
         number to clear before any of this pays.`}</p>`;
}

function seasonTotals() {
  const rows = (state.card && state.card.results) || [];
  if (rows.length < 5) return "";
  const err = rows.map(r => Math.abs(r.err ?? (r.proj - r.actual)));
  const mae = err.reduce((a, b) => a + b, 0) / err.length;
  const nErr = rows.map(r => Math.abs(r.naive - r.actual));
  const nmae = nErr.reduce((a, b) => a + b, 0) / nErr.length;
  const withLine = rows.filter(r => r.line != null);
  const hits = withLine.filter(r => r.hit).length;
  const days = new Set(rows.map(r => r.date)).size;

  const sorted = [...rows].sort((a, b) =>
    Math.abs(a.err ?? 0) - Math.abs(b.err ?? 0));
  const best = sorted[0], worst = sorted[sorted.length - 1];

  return `<dl class="totals">
    <div class="t"><dt>Starts graded</dt><dd>${rows.length}
      <small>over ${days} day${days === 1 ? "" : "s"}</small></dd></div>
    <div class="t"><dt>Average miss</dt><dd>${mae.toFixed(2)}
      <small>baseline ${nmae.toFixed(2)}</small></dd></div>
    ${withLine.length ? `<div class="t"><dt>Side record</dt>
      <dd>${hits}&ndash;${withLine.length - hits}
      <small>${Math.round(hits / withLine.length * 100)}%</small></dd></div>` : ""}
    <div class="t"><dt>Best call</dt><dd>${best.pitcher.split(" ").pop()}
      <small>${best.proj.toFixed(1)} vs ${best.actual}</small></dd></div>
    <div class="t"><dt>Worst call</dt><dd>${worst.pitcher.split(" ").pop()}
      <small>${worst.proj.toFixed(1)} vs ${worst.actual}</small></dd></div>
  </dl>`;
}

function scatter() {
  const rows = (state.card && state.card.results) || [];
  if (rows.length < 8) return "";
  const W = 560, H = 300, PAD = 34;
  const lim = Math.max(14, ...rows.map(r => Math.max(r.proj, r.actual))) + 1;
  const px = v => PAD + (v / lim) * (W - PAD - 8);
  const py = v => (H - PAD) - (v / lim) * (H - PAD - 8);

  const dots = rows.map(r => {
    const on = state.day && r.date === state.day;
    return `<circle cx="${px(r.proj).toFixed(1)}" cy="${py(r.actual).toFixed(1)}"
      r="${on ? 4.5 : 3}" fill="${on ? "var(--pencil)" : "var(--bar)"}"
      opacity="${on ? 0.95 : 0.35}"><title>${r.pitcher} ${r.date}: projected
      ${r.proj.toFixed(1)}, threw ${r.actual}</title></circle>`;
  }).join("");

  const ticks = [0, 4, 8, 12, 16].filter(t => t <= lim);
  return `<div class="scat">
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Projected against actual strikeouts for every graded start">
      ${ticks.map(t => `
        <line x1="${px(t)}" y1="8" x2="${px(t)}" y2="${H - PAD}"
          stroke="var(--rule)" stroke-width="0.5"/>
        <line x1="${PAD}" y1="${py(t)}" x2="${W - 8}" y2="${py(t)}"
          stroke="var(--rule)" stroke-width="0.5"/>
        <text x="${px(t)}" y="${H - PAD + 15}" text-anchor="middle"
          font-size="10" fill="var(--ink-soft)">${t}</text>
        <text x="${PAD - 7}" y="${py(t) + 3}" text-anchor="end"
          font-size="10" fill="var(--ink-soft)">${t}</text>`).join("")}
      <line x1="${px(0)}" y1="${py(0)}" x2="${px(lim)}" y2="${py(lim)}"
        stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
      ${dots}
      <text x="${W / 2}" y="${H - 4}" text-anchor="middle" font-size="10"
        fill="var(--ink-soft)">projected</text>
      <text x="10" y="${H / 2}" text-anchor="middle" font-size="10"
        fill="var(--ink-soft)" transform="rotate(-90 10 ${H / 2})">actual</text>
    </svg>
    <p class="scat-key">Each dot is one start. The dashed line is a perfect
      projection — dots above it are starts the model under-called, below it
      over-called. A cloud that tilts away from the line means the model runs
      high or low in a systematic, fixable way. Hover for names.</p>
  </div>`;
}

function calendar() {
  const rows = (state.card && state.card.results) || [];
  if (!rows.length) return "";
  const byDay = {};
  for (const r of rows) {
    const b = byDay[r.date] || (byDay[r.date] = { n: 0, err: 0, hit: 0, lines: 0 });
    b.n++; b.err += Math.abs(r.err || 0);
    if (r.line != null) { b.lines++; if (r.hit) b.hit++; }
  }
  const days = Object.keys(byDay).sort();
  const overall = rows.reduce((a, r) => a + Math.abs(r.err || 0), 0) / rows.length;

  return `<div class="cal">${days.map(d => {
    const b = byDay[d];
    const mae = b.err / b.n;
    const cls = mae < overall * 0.9 ? "good" : mae > overall * 1.1 ? "bad" : "";
    const label = d.slice(5).replace("-", "/");
    const sel = state.day === d ? " sel" : "";
    return `<div class="d ${cls}${sel}" data-day="${d}"
      title="${d}: ${b.n} starts, avg error ${mae.toFixed(2)}">
      ${label}<span class="n">${mae.toFixed(1)}</span></div>`;
  }).join("")}</div>
  <p class="cal-key">Average error per day, in strikeouts. Green beat the
    overall average of ${overall.toFixed(2)}, red was worse. Small numbers
    are better.</p>`;
}

function cfbView() {
  const d = state.cfb;
  if (!d || !d.games || !d.games.length) {
    return `<div class="empty"><h2>No college games loaded</h2>
      <p>Ratings are rebuilt daily from every FBS result. This fills in once
      the model has run.</p></div>`;
  }
  const wk = Math.min(...d.games.map(g => g.week));
  let week = d.games.filter(g => g.week === wk);
  const confs = [...new Set(week.flatMap(g => [g.home_conf, g.away_conf])
    .filter(Boolean))].sort();

  const q = state.q.toLowerCase();
  if (state.cfbConf)
    week = week.filter(g => g.home_conf === state.cfbConf
                         || g.away_conf === state.cfbConf);
  if (q) week = week.filter(g => g.home.toLowerCase().includes(q)
                              || g.away.toLowerCase().includes(q));
  week.sort((a, b) => b.confidence - a.confidence);

  const bt = d.backtest || {};
  return `
    <dl class="totals">
      <div class="t"><dt>Called right</dt>
        <dd>${Math.round((bt.accuracy || 0) * 100)}%
        <small>${bt.games || 0} games, ${bt.seasons || ""}</small></dd></div>
      <div class="t"><dt>Home-team baseline</dt>
        <dd>${Math.round((bt.home_baseline || 0) * 100)}%</dd></div>
      <div class="t"><dt>Margin error</dt><dd>${bt.margin_mae || "—"}
        <small>points</small></dd></div>
      <div class="t"><dt>Week</dt><dd>${wk}</dd></div>
    </dl>
    <p class="caption" style="max-width:60ch">FBS teams only, rated from every
      result since 2019. College is more predictable than the NFL — the talent
      gaps are far wider — which is why this calls a higher share than the pro
      model does. Games against non-FBS opponents still move the ratings but
      aren't shown.</p>
    <div class="daypick">
      <label for="cfbc">Conference</label>
      <select id="cfbc">
        <option value=""${state.cfbConf ? "" : " selected"}>All</option>
        ${confs.map(c => `<option value="${c}"${state.cfbConf === c ? " selected" : ""}>${c}</option>`).join("")}
      </select>
      <span class="count">${week.length} game${week.length === 1 ? "" : "s"}</span>
    </div>
    <div class="gm-head">
      <span>Matchup</span><span>Score</span><span class="pkh">Pick</span>
      <span>Win%</span><span>Margin</span>
    </div>
    <div class="gm">
      ${week.map(g => `<div class="gm-row">
        <span class="mu2">${g.away} at ${g.home}</span>
        <span class="sc">${Math.round(g.score_away)}&ndash;${Math.round(g.score_home)}</span>
        <span class="pk">${g.pick}</span>
        <span class="n cf">${Math.round(g.confidence * 100)}%</span>
        <span class="n">${g.pred_margin > 0 ? "+" : ""}${g.pred_margin.toFixed(1)}</span>
      </div>`).join("")}
    </div>
    ${pickParlays(state.cfb, "cfb")}
    <p class="cal-key">Score is away&ndash;home. The margin is reliable; the
      individual scores split a league-average total around it, so read them
      as "by about this much" rather than a scoreline.</p>`;
}

function tdGradeView() {
  const g = state.tdGrade;
  if (!g || !g.graded) {
    return `<div class="empty"><h2>Nothing graded yet</h2>
      <p>Each week's probabilities are archived, then scored once the games
      are played.</p></div>`;
  }
  const better = g.brier < g.brier_base;
  const row = (lab, m, b) => `<div class="r">
      <span>${lab}</span><span class="n">${m.toFixed(4)}</span>
      <span class="n">${b.toFixed(4)}</span>
      <span class="n ${m < b ? "ok y" : "ok n"}">${m < b ? "better" : "worse"}</span>
    </div>`;

  return `
    <div class="rec">
      <span><span class="big">${g.brier}</span>
        <span class="lbl">Brier, anytime</span></span>
      <span><span class="pctg">${g.brier_base}</span>
        <span class="lbl">guessing the base rate</span></span>
      <span class="split">${g.graded} predictions, weeks ${g.weeks.join(", ")}<br>
        ${(g.base_rate * 100).toFixed(1)}% of them scored</span>
    </div>
    <p class="cal-key">Brier measures squared error on a probability — lower
      is better, and beating the base rate means the model is distinguishing
      between players rather than guessing the average.
      ${better ? "It is." : "It isn't, on this sample."}</p>

    <div class="cal-tab">
      <div class="r h"><span>Market</span><span>Model</span>
        <span>Base rate</span><span></span></div>
      ${row("Anytime", g.brier, g.brier_base)}
      ${row("Two or more", g.brier_two, g.brier_two_base)}
    </div>
    ${(() => {
      const t = g.first_top10 || [];
      if (!t.length) return "";
      const hits = t.reduce((a, x) => a + x.hit, 0);
      const of = t.reduce((a, x) => a + x.of, 0);
      // ~14 first scorers among ~200 candidates, so 10 picked at random
      // should land about 0.7 a week.
      const chance = 0.07;
      const rate = hits / of;
      return `<p class="cal-key">First scorer, its ten most likely each week:
        <b>${hits} of ${of}</b> (${(rate * 100).toFixed(0)}%). Picking ten at
        random would hit about ${(chance * 100).toFixed(0)}%, so it is
        ${rate > chance ? `running <b>${(rate / chance).toFixed(1)}x</b> that`
          : "not beating chance"}. Brier is left out here on purpose — with
        one scorer per game among hundreds of candidates, always guessing
        "almost certainly not" scores beautifully and tells you nothing.</p>`;
    })()}

    ${g.bands && g.bands.length ? `
      <div class="cal-tab">
        <div class="r h"><span>It said</span><span>Players</span>
          <span>Said</span><span>Happened</span></div>
        ${g.bands.map(b => {
          const off = Math.abs(b.said - b.happened) > 0.08;
          return `<div class="r"><span>${b.band}</span>
            <span class="n">${b.n}</span>
            <span class="n">${Math.round(b.said * 100)}%</span>
            <span class="n ${off ? "off" : ""}">${Math.round(b.happened * 100)}%</span>
          </div>`;
        }).join("")}
      </div>
      <p class="cal-key">This is the table that matters for a probability
        model. A player given 30% is <b>supposed</b> to fail seven times in
        ten — what counts is whether the two columns line up.</p>` : ""}

    <div class="gm-head" style="grid-template-columns:2.4rem minmax(0,1fr) 3.6rem 2.8rem 3.4rem">
      <span>Wk</span><span>Player</span><span>Said</span><span>TDs</span><span>First?</span>
    </div>
    ${g.recent.map(x => `<div class="pk-row"
        style="grid-template-columns:2.4rem minmax(0,1fr) 3.6rem 2.8rem 3.4rem">
      <span class="wk">${x.week}</span>
      <span class="mu2">${x.player}</span>
      <span class="n">${Math.round(x.p_any * 100)}%</span>
      <span class="n act">${x.tds}</span>
      <span class="ok ${x.first ? "y" : ""}">${x.first ? "first" : ""}</span>
    </div>`).join("")}`;
}

  if (!r || !r.graded) {
    return `<div class="empty"><h2>Nothing graded yet</h2>

  const edge = (r.win_pct - r.home_baseline) * 100;

  return `
    <div class="rec">
      <span><span class="big">${r.won}&ndash;${r.lost}</span>
        <span class="lbl">this season</span></span>
      <span><span class="pctg">${(r.win_pct * 100).toFixed(1)}%</span>
        <span class="lbl">of picks right</span></span>
      <span class="split">home-team baseline <b>${(r.home_baseline * 100).toFixed(1)}%</b><br>
        margin error <b>${r.margin_mae}</b> points</span>
    </div>
    ${(() => {
      const a = r.ats, t = r.totals;
      if (!a || !a.graded) return "";
      const row = (lab, x, note) => {
        const p = x.win_pct * 100;
        const cls = p >= 52.4 ? "ok y" : "ok n";
        return `<div class="r">
          <span>${lab}</span>
          <span class="n">${x.won}&ndash;${x.lost}${x.push ? ` (${x.push}p)` : ""}</span>
          <span class="n ${cls}">${p.toFixed(1)}%</span>
          <span class="n" style="text-align:right;color:var(--ink-soft);font-size:0.8rem">${note}</span>
        </div>`;
      };
      return `<div class="cal-tab">
        <div class="r h"><span>Market</span><span>Record</span>
          <span>Hit</span><span>Avg gap from line</span></div>
        ${row("Spread", a, a.avg_disagreement + " pts")}
        ${t && t.graded ? row("Total", t, t.avg_disagreement + " pts") : ""}
      </div>
      <p class="cal-key">Break-even against a standard price is
        <b>52.4%</b>. Picking winners and beating a spread are different
        jobs — the spread already knows who is better, so covering it means
        beating the market's own estimate of by how much.</p>`;
    })()}

    <p class="cal-key">${edge > 0
      ? `Running <b>${edge.toFixed(1)} points</b> ahead of simply picking the
         home team every week, across ${r.graded} games.`
      : `Behind the home-team baseline by ${(-edge).toFixed(1)} points. That's
         the number this has to clear to be worth anything.`}</p>

    ${r.bands && r.bands.length ? `
      <div class="cal-tab">
        <div class="r h"><span>Confidence</span><span>Games</span>
          <span>It said</span><span>Happened</span></div>
        ${r.bands.map(b => {
          const off = Math.abs(b.said - b.happened) > 0.1;
          return `<div class="r">
            <span>${b.band}</span>
            <span class="n">${b.won}&ndash;${b.n - b.won}</span>
            <span class="n">${Math.round(b.said * 100)}%</span>
            <span class="n ${off ? "off" : ""}">${Math.round(b.happened * 100)}%</span>
          </div>`;
        }).join("")}
      </div>
      <p class="cal-key">Those last two columns should match. Where they
        don't, the model's confidence is lying — red marks a gap over
        10 points.</p>` : ""}

    <div class="gm-head" style="grid-template-columns:2.4rem minmax(0,1fr) 5rem 3.2rem 4rem">
      <span>Wk</span><span>Game</span><span>Pick</span><span>Pred</span><span>Result</span>
    </div>
    ${r.recent.map(g => `<div class="pk-row">
      <span class="wk">${g.week}</span>
      <span class="mu2">${g.away} at ${g.home}</span>
      <span>${g.pick}</span>
      <span class="n">${g.pred_margin > 0 ? "+" : ""}${g.pred_margin}</span>
      <span class="ok ${g.won ? "y" : "n"}">${g.margin > 0 ? "+" : ""}${g.margin}
        ${g.won ? "✓" : "✗"}</span>
    </div>`).join("")}`;
}

function gamesView() {
  const d = state.games;
  if (!d || !d.games || !d.games.length) {

  const wk = Math.min(...d.games.map(g => g.week));
  const week = d.games.filter(g => g.week === wk)
    .sort((a, b) => b.confidence - a.confidence);
  const q = state.q.toLowerCase();
  const rows = week.filter(g => !q || g.home.toLowerCase().includes(q)
    || g.away.toLowerCase().includes(q));
  const bt = d.backtest || {};

  return `
    <dl class="totals">
      <div class="t"><dt>Called right</dt>
        <dd>${Math.round((bt.accuracy || 0) * 100)}%
        <small>over ${bt.games || 0} games, ${bt.seasons || ""}</small></dd></div>
      <div class="t"><dt>Home-team baseline</dt>
        <dd>${Math.round((bt.home_baseline || 0) * 100)}%</dd></div>
      <div class="t"><dt>Week</dt><dd>${wk}</dd></div>
    </dl>
    <p class="caption" style="max-width:60ch">Team ratings built from every
      game since 2019, each one predicted using only what was known
      beforehand. Where the model and the Vegas line pick different sides,
      the line is marked — for reference, a professional line calls about
      66% of games right and this model calls ${Math.round((bt.accuracy || 0) * 100)}%.</p>
    <div class="gm-head">
      <span>Matchup</span><span>Score</span><span class="pkh">Pick</span>
      <span>Win%</span><span>Margin</span>
    </div>
    <div class="gm">
      ${rows.map(g => {
        const margin = g.pred_margin;
        const v = g.vegas_spread;
        const split = v != null && ((margin > 0) !== (v > 0));
