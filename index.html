
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop projections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:      #EDF0E6;
    --paper-warm: #E4E9DA;
    --rule:       #C7CFB8;
    --ink:        #1B2733;
    --ink-soft:   #5D6B78;
    --bar:        #33513F;
    --bar-fade:   #8FA394;
    --pencil:     #A3301C;

    --gutter: clamp(1rem, 4vw, 2.5rem);
    --row-pad: 0.95rem;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 62rem;
    margin: 0 auto;
    padding: clamp(1.75rem, 5vw, 3.5rem) var(--gutter) 5rem;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1.5rem;
    padding-bottom: 0.9rem;
    border-bottom: 2px solid var(--ink);
  }

  .masthead h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.05;
  }

  .masthead .date {
    display: block;
    font-size: clamp(0.9rem, 2.2vw, 1.05rem);
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0;
    margin-top: 0.25rem;
  }

  .meta {
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-align: right;
  }

  /* ---------- notice ---------- */

  .notice {
    margin-top: 1.25rem;
    padding: 0.7rem 0.95rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--pencil);
    font-size: 0.88rem;
    color: var(--ink);
  }
  .notice code {
    font-family: inherit;
    font-weight: 600;
    background: rgba(27, 39, 51, 0.07);
    padding: 0.05em 0.35em;
    border-radius: 2px;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    margin: 1.5rem 0 0.35rem;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .controls button {
    font: inherit;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 0.15rem 0.1rem;
    cursor: pointer;
  }
  .controls button:hover { color: var(--ink); }
  .controls button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--pencil);
  }
  .controls button:focus-visible {
    outline: 2px solid var(--pencil);
    outline-offset: 3px;
  }

  /* ---------- ledger ---------- */

  .ledger { border-top: 1px solid var(--ink); }

  .entry { border-bottom: 1px solid var(--rule); }

  .entry-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 0 1.1rem;
    width: 100%;
    padding: var(--row-pad) 0;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .entry-head:hover { background: rgba(51, 81, 63, 0.045); }
  .entry-head:focus-visible {
    outline: 2px solid var(--pencil);
    outline-offset: -2px;
  }

  .who { min-width: 0; }

  .name {
    font-size: clamp(1rem, 2.6vw, 1.18rem);
    font-weight: 600;
    letter-spacing: -0.012em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .matchup {
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .proj {
    font-size: clamp(1.5rem, 4.2vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
    text-align: right;
    font-feature-settings: "tnum";
  }

  .strip { display: block; }

  /* ---------- detail ---------- */

  .detail {
    display: none;
    padding: 0.35rem 0 1.6rem;
  }
  .entry[open-detail] .detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 1.1rem 1.5rem;
    padding: 1.1rem 0 1.4rem;
    border-top: 1px dashed var(--rule);
  }

  .fact dt {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0 0 0.15rem;
  }
  .fact dd {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .bet { margin: 0 0 1.2rem; }
  .bet-row {
    display: grid;
    grid-template-columns: 4.6rem 3.4rem 4.4rem 1fr;
    align-items: baseline; gap: 0 0.7rem;
    padding: 0.4rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.9rem;
  }
  .bet-row.head {
    font-size: 0.72rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--ink); padding-bottom: 0.3rem;
  }
  .bet-row .p { text-align: right; font-weight: 600; }
  .bet-row .fair { text-align: right; font-weight: 700;
                   font-variant-numeric: tabular-nums; }
  .bet-row .note { font-size: 0.8rem; color: var(--ink-soft); }
  .bet-row .good { color: var(--pencil); font-weight: 600; }
  .bet-row.atline { background: var(--paper-warm); }

  .chart-wrap { margin: 0.4rem 0 1.3rem; }

  .market {
    padding: 0.75rem 0.95rem;
    margin: 0 0 1.2rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--pencil);
    font-size: 0.9rem;
  }
  .market-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.3rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  .market-top .book {
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .market-top .juice { color: var(--ink-soft); font-size: 0.84rem; }
  .market-lines {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.3rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  .market .ev { margin-left: auto; font-weight: 600; }
  .market .ev.pos { color: var(--pencil); }
  .market .ev.neg { color: var(--ink-soft); }
  .market-cmp {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.3rem;
  }
  .market b { font-weight: 600; }
  .market .gap { margin-left: auto; color: var(--pencil); font-weight: 600; }
  .market .none { color: var(--ink-soft); }

  .caption {
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0 0 1rem;
  }

  /* ---------- empty ---------- */

  .empty {
    padding: 3.5rem 0 2rem;
    max-width: 44ch;
  }
  .empty h2 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.6rem;
  }
  .empty p { margin: 0 0 0.9rem; color: var(--ink-soft); }
  .empty pre {
    font-family: inherit;
    font-weight: 600;
    background: var(--paper-warm);
    padding: 0.7rem 0.9rem;
    margin: 0;
    overflow-x: auto;
    font-size: 0.9rem;
  }

  .card {
    margin: 1.6rem 0 0;
    padding: 0.9rem 1.05rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--bar);
  }
  .card h2 {
    margin: 0 0 0.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.4rem;
    font-size: 0.88rem;
  }
  .card-row + .card-row { margin-top: 0.35rem; }
  .card b { font-weight: 600; }
  .card .note {
    margin: 0.6rem 0 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 56ch;
  }
  .card .headline { color: var(--pencil); font-weight: 600; }

  /* --- view switch --- */
  .views {
    display: flex; align-items: baseline; gap: 0.4rem;
    margin: 1.4rem 0 0; font-size: 0.85rem; color: var(--ink-soft);
  }
  .views button {
    font: inherit; font-weight: 500; color: var(--ink-soft);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 0.15rem 0.1rem; cursor: pointer;
  }
  .views button:hover { color: var(--ink); }
  .views button[aria-pressed="true"] {
    color: var(--ink); font-weight: 600; border-bottom-color: var(--pencil);
  }
  .views button:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; }

  /* --- results --- */
  .res { border-top: 1px solid var(--ink); margin-top: 0.4rem; }
  .res-day {
    padding: 0.75rem 0 0.3rem; font-size: 0.82rem;
    font-weight: 600; color: var(--ink-soft);
  }
  .res-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.2rem 3.2rem 3.4rem auto;
    align-items: baseline; gap: 0 0.7rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.92rem;
  }
  .res-row .nm {
    font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .res-row .n { text-align: right; font-variant-numeric: tabular-nums; }
  .res-row .got { font-weight: 700; }
  .res-row .miss { color: var(--ink-soft); }
  .res-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 3.2rem 3.2rem 3.4rem auto;
    gap: 0 0.7rem; padding: 0.4rem 0;
    font-size: 0.74rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--rule);
  }
  .res-head span:not(:first-child) { text-align: right; }
  .tag {
    font-size: 0.72rem; font-weight: 600; padding: 0.05rem 0.4rem;
    background: var(--paper-warm); white-space: nowrap;
  }
  .tag.win { background: var(--bar); color: var(--paper); }
  @media (max-width: 34rem) {
    .res-row, .res-head { grid-template-columns: minmax(0,1fr) 2.7rem 2.7rem auto; }
    .res-row .bf, .res-head .bf { display: none; }
  }

  .calc {
    margin: 2rem 0 0;
    padding: 1.05rem 1.15rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--ink);
  }
  .calc h2 {
    margin: 0 0 0.15rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .calc .sub {
    margin: 0 0 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 54ch;
  }
  .calc-in {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 0.9rem;
    align-items: flex-end;
  }
  .fld { display: flex; flex-direction: column; gap: 0.2rem; }
  .fld label { font-size: 0.76rem; color: var(--ink-soft); }
  .fld input, .fld select {
    font: inherit;
    font-size: 0.92rem;
    font-variant-numeric: tabular-nums;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    border-radius: 0;
  }
  .fld input:focus, .fld select:focus {
    outline: 2px solid var(--pencil);
    outline-offset: -1px;
  }
  .fld input[type=text] { width: 11rem; }
  .fld input[type=number] { width: 5.2rem; }

  .calc-out { margin-top: 1rem; font-size: 0.9rem; }
  .calc-out .line {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.3rem;
    padding: 0.4rem 0;
    border-top: 1px solid var(--rule);
  }
  .calc-out b { font-weight: 600; }
  .calc-out .verdict {
    margin: 0.7rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    max-width: 58ch;
  }
  .calc-out .shop {
    margin-top: 0.7rem;
    padding: 0.5rem 0.7rem;
    background: var(--paper);
    border-left: 3px solid var(--pencil);
    font-size: 0.86rem;
  }

  /* --- search --- */
  .search {
    margin: 1rem 0 0;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .search input {
    font: inherit; font-size: 0.92rem;
    padding: 0.4rem 0.6rem; width: 100%; max-width: 22rem;
    border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); border-radius: 0;
  }
  .search input:focus { outline: 2px solid var(--pencil); outline-offset: -1px; }
  .search .count { font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; }

  /* --- why line --- */
  .why {
    margin: 0 0 1.1rem; font-size: 0.88rem; line-height: 1.5;
    color: var(--ink); max-width: 60ch;
  }
  .why b { font-weight: 600; }

  .wx {
    display: flex; flex-wrap: wrap; gap: 0.25rem 1.1rem;
    padding: 0.5rem 0.75rem; margin: 0 0 1.1rem;
    background: var(--paper-warm); font-size: 0.86rem;
  }
  .wx .t { font-weight: 600; }
  .wx .note { color: var(--ink-soft); }

  /* --- calendar --- */
  .cal { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.8rem 0 1.4rem; }
  .cal .d {
    width: 2.5rem; padding: 0.3rem 0.1rem; text-align: center;
    background: var(--paper-warm); font-size: 0.7rem; line-height: 1.25;
    border-bottom: 3px solid var(--rule);
  }
  .cal .d .n { display: block; font-weight: 700; font-size: 0.85rem; }
  .cal .d.good { border-bottom-color: var(--bar); }
  .cal .d.bad  { border-bottom-color: var(--pencil); }
  .cal .d { cursor: pointer; }
  .cal .d:hover { background: var(--rule); }
  .cal .d.sel { outline: 2px solid var(--pencil); outline-offset: -2px; }
  .daypick {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
    margin: 0.9rem 0 0.2rem; font-size: 0.85rem; color: var(--ink-soft);
  }
  .daypick select {
    font: inherit; font-size: 0.88rem; padding: 0.3rem 0.5rem;
    border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); border-radius: 0;
  }
  .daypick select:focus { outline: 2px solid var(--pencil); outline-offset: -1px; }
  .daypick button {
    font: inherit; font-size: 0.82rem; color: var(--ink-soft);
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 0.1rem 0; cursor: pointer;
  }
  .daypick button:hover { color: var(--ink); border-bottom-color: var(--pencil); }
  .cal-key { font-size: 0.78rem; color: var(--ink-soft); }

  /* --- season totals --- */
  .totals {
    display: flex; flex-wrap: wrap; gap: 0.9rem 2rem;
    padding: 0.9rem 1.05rem; margin: 0.9rem 0 1.2rem;
    background: var(--paper-warm); border-left: 3px solid var(--bar);
  }
  .totals .t { min-width: 6rem; }
  .totals .t dt { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 0.1rem; }
  .totals .t dd { margin: 0; font-size: 1.2rem; font-weight: 700;
                  letter-spacing: -0.02em; }
  .totals .t dd small { font-size: 0.75rem; font-weight: 500;
                        color: var(--ink-soft); letter-spacing: 0; }

  /* --- scatter --- */
  .scat { margin: 0.4rem 0 1.3rem; }
  .scat-key { font-size: 0.8rem; color: var(--ink-soft); max-width: 56ch; }

  /* --- form flags --- */
  .form {
    display: flex; flex-wrap: wrap; gap: 0.3rem 0.5rem; margin: 0 0 1rem;
  }
  .flag {
    font-size: 0.78rem; padding: 0.15rem 0.5rem;
    background: var(--paper-warm); border-left: 2px solid var(--rule);
  }
  .flag.hot { border-left-color: var(--bar); }
  .flag.cold { border-left-color: var(--pencil); }

  /* --- pitcher history --- */
  .plink { cursor: pointer; text-decoration: underline;
           text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .plink:hover { text-decoration-color: var(--pencil); }
  .pback {
    font: inherit; font-size: 0.85rem; color: var(--ink-soft);
    background: none; border: 0; padding: 0.15rem 0; cursor: pointer;
    margin-bottom: 0.6rem;
  }
  .pback:hover { color: var(--ink); }
  .phead { margin: 0 0 0.2rem; font-size: 1.3rem; font-weight: 700;
           letter-spacing: -0.025em; }
  .psum { font-size: 0.88rem; color: var(--ink-soft); margin: 0 0 1.1rem; }
  .pbars { border-top: 1px solid var(--ink); }
  .pbar {
    display: grid; grid-template-columns: 4.6rem 1fr 2.6rem 2.6rem 2.9rem;
    align-items: center; gap: 0 0.6rem;
    padding: 0.45rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.86rem;
  }
  .pbar .dt { color: var(--ink-soft); font-size: 0.8rem; }
  .pbar .track { position: relative; height: 1.15rem; }
  .pbar .pj, .pbar .ac {
    position: absolute; top: 0; height: 100%;
  }
  .pbar .pj { background: var(--bar-fade); }
  .pbar .ac { border-left: 2px solid var(--pencil); }
  .pbar .n { text-align: right; font-variant-numeric: tabular-nums; }
  .pbar .n.act { font-weight: 700; }
  .pbar .bf { text-align: right; color: var(--ink-soft); font-size: 0.8rem; }
  .phead-row {
    display: grid; grid-template-columns: 4.6rem 1fr 2.6rem 2.6rem 2.9rem;
    gap: 0 0.6rem; padding: 0.3rem 0; font-size: 0.72rem;
    color: var(--ink-soft); border-bottom: 1px solid var(--rule);
  }
  .phead-row span:not(:first-child):not(:nth-child(2)) { text-align: right; }
  @media (max-width: 34rem) {
    .pbar, .phead-row { grid-template-columns: 4rem 1fr 2.4rem 2.4rem; }
    .pbar .bf, .phead-row .bfh { display: none; }
  }

  /* --- nfl rows --- */
  .nfl-game { margin-top: 1.5rem; }
  .nfl-game h3 {
    margin: 0 0 0.1rem; font-size: 0.98rem; font-weight: 600;
    letter-spacing: -0.012em;
  }
  .nfl-game .when { font-size: 0.8rem; color: var(--ink-soft); }
  .nfl-row {
    display: grid; grid-template-columns: minmax(0,1fr) 3rem auto;
    gap: 0 0.8rem; align-items: baseline;
    padding: 0.5rem 0; border-bottom: 1px solid var(--rule);
    font-size: 0.92rem;
  }
  .nfl-row .nm { font-weight: 600; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .nfl-row .ln { text-align: right; font-weight: 700; }
  .nfl-row .px { font-size: 0.84rem; color: var(--ink-soft); }
  .nfl-row .shop { color: var(--pencil); font-weight: 600; }

  /* --- parlays --- */
  .par { margin: 2rem 0 0; }
  .par h2 {
    margin: 0 0 0.15rem; font-size: 0.95rem; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .par .sub { margin: 0 0 0.9rem; font-size: 0.82rem; color: var(--ink-soft);
              max-width: 58ch; }
  .par .stake { display: flex; align-items: center; gap: 0.5rem;
                margin-bottom: 0.9rem; font-size: 0.85rem; }
  .par .stake input {
    font: inherit; font-size: 0.9rem; width: 5.5rem;
    padding: 0.3rem 0.5rem; border: 1px solid var(--rule);
    background: var(--paper); color: var(--ink); border-radius: 0;
  }
  .slip {
    background: var(--paper-warm); border-left: 3px solid var(--bar);
    padding: 0.8rem 0.95rem; margin-bottom: 0.9rem;
  }
  .slip .n { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .slip .leg {
    display: flex; flex-wrap: wrap; gap: 0.2rem 0.7rem;
    padding: 0.2rem 0; font-size: 0.9rem;
  }
  .slip .leg .who { font-weight: 600; }
  .slip .leg .bk { color: var(--ink-soft); font-size: 0.82rem; }
  .slip .tot {
    display: flex; flex-wrap: wrap; gap: 0.3rem 1.3rem;
    margin-top: 0.55rem; padding-top: 0.55rem;
    border-top: 1px solid var(--rule); font-size: 0.9rem;
  }
  .slip .tot b { font-weight: 700; }
  .slip .warn {
    margin-top: 0.5rem; font-size: 0.82rem; color: var(--pencil);
    font-weight: 600;
  }
  .slip .cost { margin-top: 0.4rem; font-size: 0.82rem; color: var(--ink-soft); }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
    max-width: 52ch;
  }

  @media (max-width: 40rem) {
    .entry-head {
      grid-template-columns: minmax(0, 1fr) auto;
      row-gap: 0.55rem;
    }
    .strip { grid-column: 1 / -1; }
  }

const MAX_K = 16;
let state = { data: null, card: null, nfl: null, q: "", pitcher: null, day: null,
              sort: "proj", view: "slate", open: new Set() };

/* ---------- helpers ---------- */

const fmt1 = n => n.toFixed(1);

function gameTime(s) {
  // Prefer the raw timestamp so the browser shows it in the viewer's zone.
  if (s.start_iso) {
    const d = new Date(s.start_iso);
    if (!isNaN(d)) return d.toLocaleTimeString(undefined,
      { hour: "numeric", minute: "2-digit" });
  }
  return s.game_time || "";
}

function startMs(s) {
  if (s.start_iso) {
    const t = Date.parse(s.start_iso);
    if (!isNaN(t)) return t;
  }
  return Number.MAX_SAFE_INTEGER;   // undated games sort last, not first
}
const pct = n => Math.round(n * 100) + "%";

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });
}

// Inverse normal CDF (Acklam's rational approximation, ~1e-9 accurate).
// Needed to turn the market's probability back into a projected total.
function probit(p) {
  if (p <= 0 || p >= 1) return NaN;
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
             1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
             6.680131188771972e+01, -1.328068155288572e+01];
  const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
             -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
             3.754408661907416e+00];
  const pl = 0.02425, ph = 1 - pl;
  let q, r;
  if (p < pl) {
    q = Math.sqrt(-2 * Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  if (p > ph) {
    q = Math.sqrt(-2 * Math.log(1 - p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
            ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  q = p - 0.5; r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5]) * q /
         (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

function pmfSd(pmf) {
  let m = 0, m2 = 0;
  for (let i = 0; i < pmf.length; i++) { m += i * pmf[i]; m2 += i * i * pmf[i]; }
  return Math.sqrt(Math.max(0, m2 - m * m));
}

// What total is the market projecting? Invert its own probability against
// the line, using this pitcher's spread rather than a league-wide one.
function impliedMean(line, pOver, sd) {
  if (!(sd > 0) || !(pOver > 0.02) || !(pOver < 0.98)) return null;
  return line + sd * probit(pOver);
}

function tailProb(pmf, n) {
  let s = 0;
  for (let i = n; i < pmf.length; i++) s += pmf[i];
  return s;
}

/* ---------- distribution graphics ---------- */

// Compact strip shown on every row. Red tick marks the projection.
function strip(pmf, mean, line) {
  const W = 168, H = 40, n = MAX_K + 1, bw = W / n, peak = Math.max(...pmf);
  let bars = "";
  for (let i = 0; i < n; i++) {
    const h = Math.max(1, (pmf[i] / peak) * (H - 6));
    bars += `<rect x="${(i * bw + 0.6).toFixed(2)}" y="${(H - h).toFixed(2)}" ` +
            `width="${(bw - 1.2).toFixed(2)}" height="${h.toFixed(2)}" fill="var(--bar)" ` +
            `opacity="${(0.35 + 0.65 * (pmf[i] / peak)).toFixed(2)}"/>`;
  }
  const x = (mean + 0.5) * bw;
  let book = "";
  if (line != null) {
    const lx = (line + 1) * bw;
    book = `<line x1="${lx.toFixed(2)}" y1="0" x2="${lx.toFixed(2)}" y2="${H}" ` +
           `stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 2" opacity="0.65"/>`;
  }
  return `<svg class="strip" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ` +
         `role="img" aria-label="Distribution of likely strikeout totals">` +
         bars + book +
         `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${H}" ` +
         `stroke="var(--pencil)" stroke-width="1.5"/></svg>`;
}

// Full chart shown when a row is expanded.
function chart(pmf, mean, line) {
  const W = 560, H = 150, AX = 22, n = MAX_K + 1;
  const bw = W / n, peak = Math.max(...pmf), plot = H - AX;
  let bars = "", ticks = "";
  for (let i = 0; i < n; i++) {
    const h = Math.max(1, (pmf[i] / peak) * (plot - 8));
    bars += `<rect x="${(i * bw + 1).toFixed(2)}" y="${(plot - h).toFixed(2)}" ` +
            `width="${(bw - 2).toFixed(2)}" height="${h.toFixed(2)}" ` +
            `fill="var(--bar)" opacity="${(0.3 + 0.7 * (pmf[i] / peak)).toFixed(2)}"/>`;
    if (i % 2 === 0) {
      ticks += `<text x="${(i * bw + bw / 2).toFixed(2)}" y="${H - 6}" ` +
               `text-anchor="middle" font-size="11" fill="var(--ink-soft)">${i}</text>`;
    }
  }
  const x = (mean + 0.5) * bw;
  let book = "";
  if (line != null) {
    const lx = (line + 1) * bw;
    book = `<line x1="${lx.toFixed(2)}" y1="0" x2="${lx.toFixed(2)}" y2="${plot}" ` +
           `stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>`;
  }
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" ` +
         `role="img" aria-label="Probability of each strikeout total">` +
         bars + book +
         `<line x1="0" y1="${plot}" x2="${W}" y2="${plot}" stroke="var(--rule)"/>` +
         `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${plot}" ` +
         `stroke="var(--pencil)" stroke-width="1.5"/>` +
         ticks + `</svg>`;
}

/* ---------- rendering ---------- */

// The price at which a given probability is exactly fair.
function fairPrice(p) {
  if (!(p > 0.005) || !(p < 0.995)) return null;
  return p >= 0.5 ? -Math.round(100 * p / (1 - p))
                  : Math.round(100 * (1 - p) / p);
}

function breakEvenTable(s) {
  const base = Math.round(s.proj_k);
  const lo = Math.max(1, base - 2), hi = base + 2;
  const m = s.market;
  const mktThresh = m ? Math.floor(m.line) + 1 : null;

  const rows = [];
  for (let n = lo; n <= hi; n++) {
    const p = tailProb(s.pmf, n);
    const fp = fairPrice(p);
    if (fp == null) continue;
    const atLine = n === mktThresh;

    let note = "";
    if (atLine && m) {
      const offered = m.best_over.price;
      const better = toDecimal(offered) > toDecimal(fp);
      note = better
        ? `<span class="good">${m.best_over.book} pays
           ${offered > 0 ? "+" : ""}${offered} — better than fair</span>`
        : `<span class="note">best offered
           ${offered > 0 ? "+" : ""}${offered} at ${m.best_over.book}</span>`;
    }

    rows.push(`<div class="bet-row${atLine ? " atline" : ""}">
      <span>${n} or more</span>
      <span class="p">${(p * 100).toFixed(0)}%</span>
      <span class="fair">${fp > 0 ? "+" : ""}${fp}</span>
      <span>${note}</span>
    </div>`);
  }

  return `<div class="bet">
    <div class="bet-row head">
      <span>Threshold</span><span class="p">Chance</span>
      <span class="fair">Fair price</span><span></span>
    </div>
    ${rows.join("")}
  </div>
  <p class="caption">Fair price is what each threshold is worth if my
    numbers are right — take anything better, pass on anything worse.
    ${m ? "The shaded row is where the book set its line." : ""}
    These follow from the distribution above, so they're only as good
    as it is.</p>`;
}

function detail(s) {
  const m = s.market;
  const price = p => (p > 0 ? "+" : "") + p;
  const evPct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + "%";
  const best = m && (m.best_side === "Over" ? m.best_over : m.best_under);

  const mkt = m
    ? `<div class="market">
         <div class="market-lines">
           <span>Market line <b>${m.line}</b></span>
           <span>Market projects
             <b>${(() => { const im = impliedMean(m.line, m.consensus_over, pmfSd(s.pmf));
                  return im == null ? "—" : im.toFixed(1); })()}</b></span>
           <span>I project <b>${s.proj_k.toFixed(1)}</b></span>
           <span class="juice">${m.books} book${m.books === 1 ? "" : "s"},
             ${pct(m.avg_vig)} margin${m.book_spread > 0.05
               ? `, disagreeing by ${Math.round(m.book_spread * 100)} pts` : ""}</span>
         </div>
         <div class="market-top">
           <span>Market <b>${pct(m.consensus_over)}</b></span>
           <span>This model <b>${pct(m.model_over)}</b></span>
           <span class="gap">${m.edge > 0 ? "+" : ""}${Math.round(m.edge * 100)} pts</span>
         </div>
         <div class="market-cmp">
           <span>Best ${m.best_side.toLowerCase()} <b>${price(best.price)}</b>
             at ${best.book}</span>
           <span class="ev ${m.best_ev > 0 ? "pos" : "neg"}">${evPct(m.best_ev)} by my numbers</span>
         </div>
       </div>`
    : `<div class="market"><span class="none">No strikeout line posted for this start.</span></div>`;

  return `
    <div class="detail">
      ${whyLine(s)}
      ${formFlags(s.pitcher)}
      ${weatherLine(s)}
      <div class="chart-wrap">${chart(s.pmf, s.proj_k, m ? m.line : null)}</div>
      ${mkt}
      ${m ? `<p class="caption">Both percentages are the chance of clearing
        ${m.line}, with the books' margin stripped out so they're comparable.
        The last figure is what my numbers say that price is worth — which is
        only as good as the model, and the model hasn't been graded yet.</p>` : ""}
      <p class="caption">Height is the chance of that exact total. The red line is
      the projection${m ? ", the dashed line is the book's" : ""} — note how little
      of the distribution actually sits on any one number.</p>
      ${breakEvenTable(s)}
      <dl class="detail-grid">
        <div class="fact"><dt>Batters faced</dt><dd>${fmt1(s.proj_bf)}</dd></div>
        <div class="fact"><dt>Matchup K rate</dt><dd>${pct(s.k_rate)}</dd></div>
        <div class="fact"><dt>His K rate</dt><dd>${pct(s.pitcher_k_pct)}</dd></div>
        <div class="fact"><dt>Their K rate</dt><dd>${pct(s.opp_k_pct)}</dd></div>
        <div class="fact"><dt>Lineup</dt><dd>${s.lineup_confirmed ? "Posted" : "Projected"}</dd></div>
      </dl>
    </div>`;
}

function weatherLine(s) {
  const w = s.weather;
  if (!w) return "";
  if (w.indoor) {
    return `<div class="wx"><span class="t">Indoors</span>
      <span class="note">${w.roof || "Dome"} — weather isn't a factor</span></div>`;
  }
  const bits = [];
  if (w.temp_f != null) bits.push(`<span class="t">${w.temp_f}&deg;F</span>`);
  if (w.wind) bits.push(`<span>Wind ${w.wind}${w.wind_dir ? " " + w.wind_dir : ""}</span>`);
  if (w.conditions) bits.push(`<span>${w.conditions}</span>`);
  if (w.rain_pct != null && w.rain_pct >= 30)
    bits.push(`<span class="note">${w.rain_pct}% rain</span>`);
  if (!bits.length) return "";
  bits.push(`<span class="note">shown for context — not in the projection</span>`);
  return `<div class="wx">${bits.join("")}</div>`;
}

/* ---------- parlays ---------- */

function amFromDec(d) {
  return d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1));
}

function legsFor(d) {
  // Only pitchers with a market, and only the side the model prefers.
  return d.starters.filter(s => s.market && s.market.best_ev != null)
    .map(s => {
      const m = s.market;
      const over = m.best_side === "Over";
      const best = over ? m.best_over : m.best_under;
      return {
        pitcher: s.pitcher, team: s.team, opponent: s.opponent,
        side: m.best_side, line: m.line, price: best.price, book: best.book,
        dec: toDecimal(best.price),
        mine: over ? m.model_over : 1 - m.model_over,
        mkt: over ? m.consensus_over : 1 - m.consensus_over,
        ev: m.best_ev,
      };
    })
    .sort((a, b) => b.ev - a.ev);
}

function sameGame(a, b) {
  return (a.team === b.opponent && a.opponent === b.team);
}

function buildSlip(legs, stake) {
  const dec = legs.reduce((x, l) => x * l.dec, 1);
  const mine = legs.reduce((x, l) => x * l.mine, 1);
  const mkt = legs.reduce((x, l) => x * l.mkt, 1);
  const be = 1 / dec;
  const ev = mine * (dec - 1) - (1 - mine);
  // Fair price if the books took no margin, from their own devigged numbers.
  const fairDec = 1 / mkt;
  const hold = 1 - dec / fairDec;
  const b = dec - 1;
  const kelly = Math.max(0, (mine * b - (1 - mine)) / b);
  // Same sum, if the model is 5 points pessimistic on each leg.
  const shaded = legs.reduce((x, l) => x * Math.max(0.02, l.mine - 0.05), 1);
  const kellyLow = Math.max(0, (shaded * b - (1 - shaded)) / b);

  const clash = legs.some((l, i) => legs.slice(i + 1).some(o => sameGame(l, o)));

  return `<div class="slip">
    <div class="n">${legs.length} leg${legs.length === 1 ? "" : "s"}</div>
    ${legs.map(l => `<div class="leg">
      <span class="who">${l.pitcher}</span>
      <span>${l.side} ${l.line}</span>
      <span>${l.price > 0 ? "+" : ""}${l.price}</span>
      <span class="bk">${l.book}</span>
    </div>`).join("")}
    <div class="tot">
      <span>Pays <b>${amFromDec(dec) > 0 ? "+" : ""}${amFromDec(dec)}</b></span>
      <span>$${stake} returns <b>$${(stake * dec).toFixed(2)}</b></span>
      <span>Needs <b>${(be * 100).toFixed(1)}%</b></span>
      <span>My model <b>${(mine * 100).toFixed(1)}%</b></span>
    </div>
    <div class="cost">The books' margin on this combination is
      <b>${(hold * 100).toFixed(1)}%</b> — that's what the parlay costs you
      versus the same legs bet singly.</div>
    <div class="cost">Kelly would stake ${(kelly * 100).toFixed(1)}% of your
      bankroll on my numbers — but only ${(kellyLow * 100).toFixed(1)}% if each
      leg is 5 points worse than I think. That swing is the point.</div>
    ${clash ? `<div class="warn">Two legs are in the same game. Their outcomes
      move together, so the combined probability above is overstated.</div>` : ""}
  </div>`;
}

function parlayPanel() {
  const d = state.data;
  if (!d) return "";
  const legs = legsFor(d);
  if (legs.length < 2) {
    return `<div class="par"><h2>Parlays</h2>
      <p class="sub">Needs at least two pitchers with posted lines. Once the
      board fills in, suggestions appear here.</p></div>`;
  }

  const stake = state.stake || 10;

  // Enumerate every valid combination of 2 to 4 legs, score by combined EV,
  // then pick five with a cap on how often any one leg reappears - otherwise
  // the top five are all the same pitcher with a rotating partner.
  const pool = legs.slice(0, 10);
  const combos = [];
  const walk = (start, chosen) => {
    if (chosen.length >= 2 && chosen.length <= 4) {
      const dec = chosen.reduce((x, l) => x * l.dec, 1);
      const mine = chosen.reduce((x, l) => x * l.mine, 1);
      combos.push({ legs: [...chosen], ev: mine * (dec - 1) - (1 - mine) });
    }
    if (chosen.length === 4) return;
    for (let i = start; i < pool.length; i++) {
      if (chosen.some(c => sameGame(c, pool[i]))) continue;
      chosen.push(pool[i]);
      walk(i + 1, chosen);
      chosen.pop();
    }
  };
  walk(0, []);
  combos.sort((a, b) => b.ev - a.ev);

  const MAX_REUSE = 3;
  const used = {};
  const picked = [];
  for (const c of combos) {
    if (picked.length >= 5) break;
    if (c.legs.some(l => (used[l.pitcher] || 0) >= MAX_REUSE)) continue;
    picked.push(c);
    c.legs.forEach(l => { used[l.pitcher] = (used[l.pitcher] || 0) + 1; });
  }
  const slips = picked.map(c => buildSlip(c.legs, stake));

  return `<div class="par">
    <h2>Suggested parlays</h2>
    <p class="sub">Five combinations of two to four legs, ranked by my
      numbers, best available price on each. No leg appears more than three
      times, so these are genuinely different bets rather than one pitcher
      with rotating partners. Showing more of them doesn't make any of them
      better — the model beats a season average by 0.04 strikeouts and has
      never been tested against a book, and errors multiply across legs.</p>
    <div class="stake">
      <label for="stk">Stake $</label>
      <input id="stk" type="number" min="1" step="1" value="${stake}">
    </div>
    ${slips.join("")}
  </div>`;
}

function formFlags(name) {
  const past = ((state.card && state.card.results) || [])
    .filter(r => r.pitcher === name).slice(0, 5);
  if (past.length < 3) return "";
  const flags = [];

  // Which side of the projection have recent starts landed on?
  const last3 = past.slice(0, 3);
  if (last3.every(r => r.actual > r.proj))
    flags.push(`<span class="flag hot">Beat the projection 3 straight</span>`);
  else if (last3.every(r => r.actual < r.proj))
    flags.push(`<span class="flag cold">Fell short 3 straight</span>`);

  // Workload direction - the thing that caps or raises the ceiling.
  const bfs = past.filter(r => r.bf).map(r => r.bf);
  if (bfs.length >= 4) {
    const recent = (bfs[0] + bfs[1]) / 2;
    const older = bfs.slice(2).reduce((a, b) => a + b, 0) / bfs.slice(2).length;
    if (recent - older >= 2.5)
      flags.push(`<span class="flag hot">Going deeper lately —
        ${recent.toFixed(0)} batters vs ${older.toFixed(0)}</span>`);
    else if (older - recent >= 2.5)
      flags.push(`<span class="flag cold">Shorter outings lately —
        ${recent.toFixed(0)} batters vs ${older.toFixed(0)}</span>`);
  }

  // Raw strikeout form.
  const ks = past.map(r => r.actual);
  const hi = Math.max(...ks), lo = Math.min(...ks);
  if (hi - lo >= 6)
    flags.push(`<span class="flag">Volatile — ${lo} to ${hi} over
      ${past.length} starts</span>`);

  return flags.length ? `<div class="form">${flags.join("")}</div>` : "";
}

function whyLine(s) {
  const lg = (state.data && state.data.league_k_pct) || 0.223;
  const bits = [];

  const pk = s.pitcher_k_pct, ok = s.opp_k_pct;
  const pRel = pk / lg, oRel = ok / lg;

  bits.push(pRel > 1.25 ? `<b>${s.pitcher}</b> strikes out far more hitters than average`
    : pRel > 1.08 ? `<b>${s.pitcher}</b> runs a better-than-average strikeout rate`
    : pRel < 0.8 ? `<b>${s.pitcher}</b> is well below average at missing bats`
    : `<b>${s.pitcher}</b> is around league average at missing bats`);

  bits.push(oRel > 1.12 ? `${s.opponent} strike out a lot`
    : oRel < 0.9 ? `${s.opponent} are a tough, contact-heavy lineup`
    : `${s.opponent} are about average in that respect`);

  const bf = s.proj_bf;
  bits.push(bf >= 25.5 ? `and he's been going deep — about ${bf.toFixed(0)} batters a start`
    : bf <= 21 ? `but he's only facing about ${bf.toFixed(0)} batters a start, which caps the ceiling`
    : `facing roughly ${bf.toFixed(0)} batters a start`);

  let txt = bits[0] + ", " + bits[1] + ", " + bits[2] + ".";

  if (s.starts_ytd != null && s.starts_ytd < 5) {
    txt += ` Only ${s.starts_ytd} start${s.starts_ytd === 1 ? "" : "s"} on record,
             so this leans heavily on league average.`;
  }
  const m = s.market;
  if (m && Math.abs(m.edge) > 0.15) {
    txt += ` The books disagree by ${Math.round(Math.abs(m.edge) * 100)} points —
             usually a sign the model is missing something they know.`;
  }
  return `<p class="why">${txt}</p>`;
}

function seasonTotals() {
  const rows = (state.card && state.card.results) || [];
  if (rows.length < 5) return "";
  const err = rows.map(r => Math.abs(r.err ?? (r.proj - r.actual)));
  const mae = err.reduce((a, b) => a + b, 0) / err.length;
  const nErr = rows.map(r => Math.abs(r.naive - r.actual));
  const nmae = nErr.reduce((a, b) => a + b, 0) / nErr.length;
  const withLine = rows.filter(r => r.line != null);
  const hits = withLine.filter(r => r.hit).length;
  const days = new Set(rows.map(r => r.date)).size;

  const sorted = [...rows].sort((a, b) =>
    Math.abs(a.err ?? 0) - Math.abs(b.err ?? 0));
  const best = sorted[0], worst = sorted[sorted.length - 1];

  return `<dl class="totals">
    <div class="t"><dt>Starts graded</dt><dd>${rows.length}
      <small>over ${days} day${days === 1 ? "" : "s"}</small></dd></div>
    <div class="t"><dt>Average miss</dt><dd>${mae.toFixed(2)}
      <small>baseline ${nmae.toFixed(2)}</small></dd></div>
    ${withLine.length ? `<div class="t"><dt>Side record</dt>
      <dd>${hits}&ndash;${withLine.length - hits}
      <small>${Math.round(hits / withLine.length * 100)}%</small></dd></div>` : ""}
    <div class="t"><dt>Best call</dt><dd>${best.pitcher.split(" ").pop()}
      <small>${best.proj.toFixed(1)} vs ${best.actual}</small></dd></div>
    <div class="t"><dt>Worst call</dt><dd>${worst.pitcher.split(" ").pop()}
      <small>${worst.proj.toFixed(1)} vs ${worst.actual}</small></dd></div>
  </dl>`;
}

function scatter() {
  const rows = (state.card && state.card.results) || [];
  if (rows.length < 8) return "";
  const W = 560, H = 300, PAD = 34;
  const lim = Math.max(14, ...rows.map(r => Math.max(r.proj, r.actual))) + 1;
  const px = v => PAD + (v / lim) * (W - PAD - 8);
  const py = v => (H - PAD) - (v / lim) * (H - PAD - 8);

  const dots = rows.map(r => {
    const on = state.day && r.date === state.day;
    return `<circle cx="${px(r.proj).toFixed(1)}" cy="${py(r.actual).toFixed(1)}"
      r="${on ? 4.5 : 3}" fill="${on ? "var(--pencil)" : "var(--bar)"}"
      opacity="${on ? 0.95 : 0.35}"><title>${r.pitcher} ${r.date}: projected
      ${r.proj.toFixed(1)}, threw ${r.actual}</title></circle>`;
  }).join("");

  const ticks = [0, 4, 8, 12, 16].filter(t => t <= lim);
  return `<div class="scat">
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Projected against actual strikeouts for every graded start">
      ${ticks.map(t => `
        <line x1="${px(t)}" y1="8" x2="${px(t)}" y2="${H - PAD}"
          stroke="var(--rule)" stroke-width="0.5"/>
        <line x1="${PAD}" y1="${py(t)}" x2="${W - 8}" y2="${py(t)}"
          stroke="var(--rule)" stroke-width="0.5"/>
        <text x="${px(t)}" y="${H - PAD + 15}" text-anchor="middle"
          font-size="10" fill="var(--ink-soft)">${t}</text>
        <text x="${PAD - 7}" y="${py(t) + 3}" text-anchor="end"
          font-size="10" fill="var(--ink-soft)">${t}</text>`).join("")}
      <line x1="${px(0)}" y1="${py(0)}" x2="${px(lim)}" y2="${py(lim)}"
        stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
      ${dots}
      <text x="${W / 2}" y="${H - 4}" text-anchor="middle" font-size="10"
        fill="var(--ink-soft)">projected</text>
      <text x="10" y="${H / 2}" text-anchor="middle" font-size="10"
        fill="var(--ink-soft)" transform="rotate(-90 10 ${H / 2})">actual</text>
    </svg>
    <p class="scat-key">Each dot is one start. The dashed line is a perfect
      projection — dots above it are starts the model under-called, below it
      over-called. A cloud that tilts away from the line means the model runs
      high or low in a systematic, fixable way. Hover for names.</p>
  </div>`;
}

function calendar() {
  const rows = (state.card && state.card.results) || [];
  if (!rows.length) return "";
  const byDay = {};
  for (const r of rows) {
    const b = byDay[r.date] || (byDay[r.date] = { n: 0, err: 0, hit: 0, lines: 0 });
    b.n++; b.err += Math.abs(r.err || 0);
    if (r.line != null) { b.lines++; if (r.hit) b.hit++; }
  }
  const days = Object.keys(byDay).sort();
  const overall = rows.reduce((a, r) => a + Math.abs(r.err || 0), 0) / rows.length;

  return `<div class="cal">${days.map(d => {
    const b = byDay[d];
    const mae = b.err / b.n;
    const cls = mae < overall * 0.9 ? "good" : mae > overall * 1.1 ? "bad" : "";
    const label = d.slice(5).replace("-", "/");
    const sel = state.day === d ? " sel" : "";
    return `<div class="d ${cls}${sel}" data-day="${d}"
      title="${d}: ${b.n} starts, avg error ${mae.toFixed(2)}">
      ${label}<span class="n">${mae.toFixed(1)}</span></div>`;
  }).join("")}</div>
  <p class="cal-key">Average error per day, in strikeouts. Green beat the
    overall average of ${overall.toFixed(2)}, red was worse. Small numbers
    are better.</p>`;
}

function nflView() {
  const d = state.nfl;
  if (!d || !d.games || !d.games.length) {
    return `<div class="empty"><h2>No reception lines yet</h2>
      <p>Lines are captured a few hours before each kickoff. This fills in
      once the first game is collected.</p></div>`;
  }
  const q = state.q.toLowerCase();
  let shown = 0;

  const html = d.games.map(g => {
    const ps = g.players.filter(p => !q || p.player.toLowerCase().includes(q)
                                      || g.matchup.toLowerCase().includes(q));
    if (!ps.length) return "";
    shown += ps.length;
    return `<div class="nfl-game">
      <h3>${g.matchup}</h3>
      <div class="when">${g.players.length} players · ${g.snapshots} snapshot${g.snapshots === 1 ? "" : "s"}</div>
      ${ps.map(p => {
        const best = Math.max(p.shop_over, p.shop_under);
        const side = p.shop_over >= p.shop_under ? "over" : "under";
        return `<div class="nfl-row">
          <span class="nm">${p.player}</span>
          <span class="ln">${p.line}</span>
          <span class="px">${pct(p.consensus_over)} over ·
            best over <b>${p.best_over.price > 0 ? "+" : ""}${p.best_over.price}</b>
            ${p.best_over.book}
            ${best >= 3 ? `· <span class="shop">$${best.toFixed(0)} in the ${side}</span>` : ""}
          </span>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  return `<p class="caption" style="max-width:58ch">What the books are pricing,
    margins removed. No projections here — the dollar figures are what taking
    the best price instead of the worst is worth per $100.</p>
    ${html || `<div class="empty"><p>Nothing matches "${state.q}".</p></div>`}`;
}

function pitcherView(name) {
  const all = ((state.card && state.card.results) || [])
    .filter(r => r.pitcher === name);
  const rows = all.slice(0, 10);

  let body;
  if (!rows.length) {
    body = `<p class="psum">No graded starts for ${name} yet. Results appear
      the morning after each game.</p>`;
  } else {
    const errs = rows.map(r => Math.abs(r.err ?? (r.proj - r.actual)));
    const mae = errs.reduce((a, b) => a + b, 0) / errs.length;
    const high = rows.filter(r => r.proj > r.actual).length;
    const withLine = rows.filter(r => r.line != null);
    const hits = withLine.filter(r => r.hit).length;
    const max = Math.max(...rows.map(r => Math.max(r.proj, r.actual)), 8);
    const bfs = rows.filter(r => r.bf).map(r => r.bf);
    const avgBf = bfs.length ? bfs.reduce((a, b) => a + b, 0) / bfs.length : null;
    const ks = rows.map(r => r.actual);
    const avgK = ks.reduce((a, b) => a + b, 0) / ks.length;

    body = `
      <p class="psum">Last ${rows.length} graded start${rows.length === 1 ? "" : "s"}:
        averaging <b>${avgK.toFixed(1)}</b> strikeouts${avgBf
          ? ` on <b>${avgBf.toFixed(1)}</b> batters faced` : ""}.
        Model missed by ${mae.toFixed(2)} on average, projected high on ${high} of
        ${rows.length}.${withLine.length
          ? ` Its side hit ${hits} of ${withLine.length} times.` : ""}</p>
      <div class="phead-row">
        <span>Date</span><span></span><span>Proj</span><span>K</span>
        <span class="bfh">BF</span>
      </div>
      <div class="pbars">
        ${rows.map(r => {
          const pw = (r.proj / max) * 100, aw = (r.actual / max) * 100;
          return `<div class="pbar">
            <span class="dt">${r.date.slice(5)}</span>
            <span class="track">
              <span class="pj" style="left:0;width:${pw.toFixed(1)}%"></span>
              <span class="ac" style="left:${aw.toFixed(1)}%;width:2px"></span>
            </span>
            <span class="n">${r.proj.toFixed(1)}</span>
            <span class="n act">${r.actual}</span>
            <span class="bf">${r.bf || "—"}</span>
          </div>`;
        }).join("")}
      </div>
      <p class="cal-key">Bar is the projection, red mark is what he actually
        threw. ${all.length > 10 ? `${all.length} starts on record, showing 10.` : ""}</p>`;
  }

  return `<button class="pback" id="pb">&larr; back</button>
    <h2 class="phead">${name}</h2>${body}`;
}

function results() {
  const rows = (state.card && state.card.results) || [];
  if (!rows.length) {
    return `<div class="empty"><h2>No results yet</h2>
      <p>Each day gets graded the following morning, once the games have
      finished. Check back tomorrow.</p></div>`;
  }

  const allDays = [...new Set(rows.map(r => r.date))].sort().reverse();
  if (state.day && !allDays.includes(state.day)) state.day = null;
  const shown = state.day ? rows.filter(r => r.date === state.day) : rows;

  const picker = `<div class="daypick">
      <label for="dsel">Day</label>
      <select id="dsel">
        <option value=""${state.day ? "" : " selected"}>All ${allDays.length} days</option>
        ${allDays.map(d => `<option value="${d}"${state.day === d ? " selected" : ""}
          >${prettyDate(d)}</option>`).join("")}
      </select>
      ${state.day ? `<button id="dclear">show all</button>` : ""}
    </div>`;

  const withLine = shown.filter(r => r.line != null);
  const hits = withLine.filter(r => r.hit).length;
  const closer = withLine.filter(r => r.closer).length;

  const days = [];
  let cur = null;
  for (const r of shown) {
    if (!cur || cur.date !== r.date) { cur = { date: r.date, rows: [] }; days.push(cur); }
    cur.rows.push(r);
  }

  const head = `<div class="res-head">
      <span>Pitcher</span><span>Proj</span><span>Actual</span>
      <span class="bf">Line</span><span></span></div>`;

  return `
    ${picker}
    <p class="caption" style="max-width:58ch">${state.day
      ? `${shown.length} start${shown.length === 1 ? "" : "s"} on this day.`
      : "Every graded start, newest first."}
      ${withLine.length ? `Where a line existed, the model's side came in
      ${hits} of ${withLine.length} times, and its projection was closer to the
      real number than the line was on ${closer}.` : ""}</p>
    ${seasonTotals()}
    ${calendar()}
    ${scatter()}
    <div class="res">
      ${days.map(d => `
        <div class="res-day">${prettyDate(d.date)}</div>
        ${head}
        ${d.rows.map(r => `
          <div class="res-row">
            <span class="nm plink" data-pitcher="${r.pitcher}">${r.pitcher}</span>
            <span class="n">${r.proj.toFixed(1)}</span>
            <span class="n got">${r.actual}</span>
            <span class="n bf">${r.line != null ? r.line : "—"}</span>
            <span>${r.line != null
              ? `<span class="tag ${r.hit ? "win" : "miss"}">${r.side}
                 ${r.hit ? "hit" : "miss"}</span>`
              : ""}</span>
          </div>`).join("")}`).join("")}
    </div>`;
}

function scorecard() {
  const c = state.card;
  if (!c || !c.starts) {
    return `<div class="card"><h2>Accuracy</h2>
      <p class="note">Nothing graded yet. Each finished day gets scored against
      the real results; come back after a couple of weeks.</p></div>`;
  }

  const m = c.market;
  const rate = m && m.win_rate != null ? m.win_rate : null;
  const thin = c.starts < 150;

  return `<div class="card">
    <h2>Accuracy over ${c.days} day${c.days === 1 ? "" : "s"},
        ${c.starts} start${c.starts === 1 ? "" : "s"}</h2>
    <div class="card-row">
      <span>My error <b>${c.mae_model}</b></span>
      <span>Season-average baseline <b>${c.mae_naive}</b></span>
      ${m ? `<span>The books <b>${m.mae_book}</b></span>` : ""}
    </div>
    <div class="card-row">
      <span>Strikeout bias <b>${c.bias_k > 0 ? "+" : ""}${c.bias_k}</b></span>
      <span>Batters faced <b>${c.bias_bf > 0 ? "+" : ""}${c.bias_bf}</b></span>
      <span>Real spread <b>${c.sd_actual}</b></span>
    </div>
    ${rate != null ? `<div class="card-row"><span class="headline">
      Disagreed with the books by a full strikeout ${m.disagreements} times,
      and was closer on ${Math.round(rate * 100)}% of them.</span></div>` : ""}
    <p class="note">${thin
      ? `Under 150 starts, a gap this size is indistinguishable from luck. Keep collecting.`
      : (rate != null && rate <= 0.5
        ? `Losing the disagreements. The gaps flagged on the slate are this model's
           blind spots rather than anything the market missed.`
        : `Ahead of the baseline. The disagreement rate is the number that decides
           whether the flagged gaps mean anything.`)}</p>
  </div>`;
}

/* ---------- price checker ---------- */

const toDecimal = p => (p > 0 ? 1 + p / 100 : 1 + 100 / -p);
const breakEven = p => 1 / toDecimal(p);
const fmtPrice = p => (p > 0 ? "+" : "") + p;

function calcPanel() {
  const names = state.data
    ? state.data.starters.map(s => s.pitcher).sort()
    : [];
  return `<div class="calc">
    <h2>Check a price</h2>
    <p class="sub">Enter a price you've been offered. This shows the arithmetic:
      what the price needs to be worth taking, what the market thinks, and
      whether a better number exists elsewhere.</p>
    <div class="calc-in">
      <div class="fld">
        <label for="c-name">Pitcher</label>
        <input id="c-name" type="text" list="c-list" placeholder="Any name" autocomplete="off">
        <datalist id="c-list">${names.map(n => `<option value="${n}">`).join("")}</datalist>
      </div>
      <div class="fld">
        <label for="c-side">Side</label>
        <select id="c-side"><option>Over</option><option>Under</option></select>
      </div>
      <div class="fld">
        <label for="c-line">Line</label>
        <input id="c-line" type="number" step="0.5" placeholder="5.5">
      </div>
      <div class="fld">
        <label for="c-odds">Odds</label>
        <input id="c-odds" type="number" step="5" placeholder="-115">
      </div>
      <div class="fld">
        <label for="c-other">Other side <span style="opacity:.6">(optional)</span></label>
        <input id="c-other" type="number" step="5" placeholder="-105">
      </div>
    </div>
    <div class="calc-out" id="c-out"></div>
  </div>`;
}

function runCalc() {
  const name = document.getElementById("c-name").value.trim();
  const side = document.getElementById("c-side").value;
  const line = parseFloat(document.getElementById("c-line").value);
  const odds = parseFloat(document.getElementById("c-odds").value);
  const other = parseFloat(document.getElementById("c-other").value);
  const out = document.getElementById("c-out");

  if (!odds || Math.abs(odds) < 100) { out.innerHTML = ""; return; }

  const be = breakEven(odds);
  let html = `<div class="line">
      <span>Pays <b>${fmtPrice(odds)}</b></span>
      <span>Needs <b>${(be * 100).toFixed(1)}%</b> to break even</span>
    </div>`;

  // If both sides given, the vig can be stripped without any model at all.
  if (other && Math.abs(other) >= 100) {
    const a = breakEven(odds), b = breakEven(other);
    const fair = a / (a + b);
    html += `<div class="line">
      <span>Fair after vig <b>${(fair * 100).toFixed(1)}%</b></span>
      <span>Book's margin <b>${((a + b - 1) * 100).toFixed(1)}%</b></span>
    </div>`;
  }

  // Anything below needs the pitcher to be on today's slate.
  const s = state.data && state.data.starters.find(
    x => x.pitcher.toLowerCase() === name.toLowerCase());

  if (s && !isNaN(line)) {
    const threshold = Math.floor(line) + 1;
    const pOver = s.pmf.slice(threshold).reduce((a, b) => a + b, 0);
    const mine = side === "Over" ? pOver : 1 - pOver;
    const ev = mine * (toDecimal(odds) - 1) - (1 - mine);

    html += `<div class="line">
        <span>My model <b>${(mine * 100).toFixed(1)}%</b></span>
        <span>Edge over break-even
          <b>${((mine - be) * 100).toFixed(1)} pts</b></span>
        <span>EV <b>${(ev * 100).toFixed(1)}%</b></span>
      </div>`;

    const m = s.market;
    if (m) {
      const mkt = side === "Over" ? m.consensus_over : 1 - m.consensus_over;
      html += `<div class="line">
          <span>Market line <b>${m.line}</b></span>
          <span>Market <b>${(mkt * 100).toFixed(1)}%</b>
            across ${m.books} book${m.books === 1 ? "" : "s"}</span>
        </div>`;

      // Line shopping - the one edge that doesn't depend on any model.
      const best = side === "Over" ? m.best_over : m.best_under;
      if (best && m.line === line) {
        const gain = (toDecimal(best.price) - toDecimal(odds)) * 100;
        html += gain > 0.5
          ? `<div class="shop"><b>${best.book} has ${fmtPrice(best.price)}</b>
             on the same line — about $${gain.toFixed(0)} more per $100 staked,
             for the same bet. This part doesn't depend on the model being right.</div>`
          : `<div class="shop">That's the best price I found across
             ${m.books} book${m.books === 1 ? "" : "s"}.</div>`;
      }
    }

    html += `<p class="verdict">The model has not been graded against results
      yet, so treat the EV figure as a disagreement with the market rather
      than an edge over it. The break-even and vig figures above are just
      arithmetic and hold regardless.</p>`;
  } else if (name) {
    html += `<p class="verdict">${name} isn't on today's slate, so there's no
      model number for him — but the break-even${other ? " and vig" : ""}
      arithmetic above applies to any bet in any sport.</p>`;
  } else {
    html += `<p class="verdict">Add a pitcher from today's slate and a line to
      compare against the model and check for a better price.</p>`;
  }

  out.innerHTML = html;
}

function render() {
  const d = state.data;
  document.getElementById("date").textContent = prettyDate(d.date);

  const t = new Date(d.generated_at);
  document.getElementById("meta").innerHTML =
    `${d.starters.length} starters<br>built ${t.toLocaleTimeString(undefined,
      { hour: "numeric", minute: "2-digit" })}`;

  document.getElementById("notice").innerHTML = d.sample
    ? `<div class="notice">Showing a sample slate — these are made-up numbers, not
       today's games. Run <code>python build_projections.py</code> to write a real
       <code>projections.json</code> next to this page.</div>`
    : "";

  const q = state.q.toLowerCase();
  const rows = [...d.starters].filter(s => !q
      || s.pitcher.toLowerCase().includes(q)
      || (s.team || "").toLowerCase().includes(q)
      || (s.opponent || "").toLowerCase().includes(q)).sort(
    state.sort === "proj"
      ? (a, b) => b.proj_k - a.proj_k
      : (a, b) => startMs(a) - startMs(b) || b.proj_k - a.proj_k
  );

  const nflCount = state.nfl && state.nfl.totals ? state.nfl.totals.players : 0;
  const viewBar = `
    <div class="views">
      <span>Showing</span>
      <button data-view="slate" aria-pressed="${state.view === "slate"}">strikeouts</button>
      <span aria-hidden="true">·</span>
      <button data-view="nfl" aria-pressed="${state.view === "nfl"}">receptions${
        nflCount ? ` (${nflCount})` : ""}</button>
      <span aria-hidden="true">·</span>
      <button data-view="results" aria-pressed="${state.view === "results"}">past results</button>
    </div>`;

  const searchBar = `
    <div class="search">
      <input id="q" type="search" placeholder="Search players or teams"
             value="${state.q.replace(/"/g, "&quot;")}" autocomplete="off">
      <span class="count" id="qc"></span>
    </div>`;

  const wire = () => {
    document.querySelectorAll(".views button").forEach(b =>
      b.onclick = () => { state.view = b.dataset.view; render(); });
    const q = document.getElementById("q");
    if (q) {
      q.oninput = () => {
        state.q = q.value;
        render();
        const el = document.getElementById("q");
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
    }
  };

  if (state.pitcher) {
    document.getElementById("body").innerHTML = pitcherView(state.pitcher);
    document.getElementById("pb").onclick = () => { state.pitcher = null; render(); };
    document.getElementById("card").innerHTML = "";
    document.getElementById("calc").innerHTML = "";
    document.getElementById("footer").innerHTML = "";
    return;
  }

  if (state.view === "results") {
    document.getElementById("body").innerHTML = viewBar + results();
    wire();
    document.querySelectorAll(".plink").forEach(el =>
      el.onclick = () => { state.pitcher = el.dataset.pitcher; render(); });
    const dsel = document.getElementById("dsel");
    if (dsel) dsel.onchange = () => { state.day = dsel.value || null; render(); };
    const dclr = document.getElementById("dclear");
    if (dclr) dclr.onclick = () => { state.day = null; render(); };
    document.querySelectorAll(".cal .d").forEach(el =>
      el.onclick = () => {
        state.day = state.day === el.dataset.day ? null : el.dataset.day;
        render();
      });
    document.getElementById("card").innerHTML = scorecard();
    document.getElementById("calc").innerHTML = "";
    document.getElementById("footer").innerHTML = "";
    return;
  }

  if (state.view === "nfl") {
    document.getElementById("body").innerHTML = viewBar + searchBar + nflView();
    wire();
    document.getElementById("card").innerHTML = "";
    document.getElementById("calc").innerHTML = "";
    document.getElementById("footer").innerHTML =
      `Reception lines only. There is no reception projection here — a model
       tested on the full 2025 season failed to beat each player's own season
       average, so none is shown.`;
    return;
  }

  document.getElementById("body").innerHTML = viewBar + searchBar + `
    <div class="controls">
      <span>Sort by</span>
      <button data-sort="proj" aria-pressed="${state.sort === "proj"}">projection</button>
      <span aria-hidden="true">·</span>
      <button data-sort="time" aria-pressed="${state.sort === "time"}">first pitch</button>
    </div>
    <div class="ledger">
      ${rows.length ? rows.map(s => {
        const key = s.pitcher + s.opponent;
        const open = state.open.has(key);
        const vs = s.home ? "vs" : "at";
        return `
        <div class="entry" data-key="${key}" ${open ? "open-detail" : ""}>
          <button class="entry-head" aria-expanded="${open}">
            <span class="who">
              <span class="name">${s.pitcher}</span>
              <span class="matchup">${s.team} ${vs} ${s.opponent} · ${s.venue} · ${gameTime(s)}</span>
            </span>
            <span class="proj">${fmt1(s.proj_k)}</span>
            ${strip(s.pmf, s.proj_k, s.market ? s.market.line : null)}
          </button>
          ${detail(s)}
        </div>`;
      }).join("") : `<p class="caption">Nothing matches "${state.q}".</p>`}
    </div>`;

  document.getElementById("card").innerHTML = scorecard();
  document.getElementById("calc").innerHTML = calcPanel() + parlayPanel();
  ["c-name", "c-side", "c-line", "c-odds", "c-other"].forEach(id =>
    document.getElementById(id).addEventListener("input", runCalc));
  const stk = document.getElementById("stk");
  if (stk) stk.oninput = () => {
    state.stake = Math.max(1, parseFloat(stk.value) || 10);
    document.getElementById("calc").innerHTML = calcPanel() + parlayPanel();
    const el = document.getElementById("stk");
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    el.oninput = stk.oninput;
  };

  document.getElementById("footer").innerHTML =
    `Projections combine each pitcher's strikeout rate with the opposing lineup's,
     then apply it across the batters he's expected to face. A start has a standard
     deviation of roughly two and a half strikeouts, so treat any single number as
     the middle of a wide range.`;

  document.querySelectorAll(".controls button").forEach(b =>
    b.onclick = () => { state.sort = b.dataset.sort; render(); });
  wire();
  const qc = document.getElementById("qc");
  if (qc && state.q) qc.textContent = `${rows.length} of ${d.starters.length}`;

  document.querySelectorAll(".entry-head").forEach(b => b.onclick = () => {
    const entry = b.closest(".entry"), key = entry.dataset.key;
    state.open.has(key) ? state.open.delete(key) : state.open.add(key);
    entry.toggleAttribute("open-detail");
    b.setAttribute("aria-expanded", state.open.has(key));
  });
}

function empty(reason) {
  document.getElementById("body").innerHTML = `
    <div class="empty">
      <h2>No slate loaded</h2>
      <p>${reason}</p>
      <p>Build today's file, then serve this folder so the page can read it:</p>
      <pre>python build_projections.py
python -m http.server 8000</pre>
      <p>Then open localhost:8000 in your browser. Opening the file directly
         won't work — browsers block pages on <code>file://</code> from reading
         other local files.</p>
    </div>`;
}

Promise.all([
  fetch("scorecard.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("receptions.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([c, n]) => { state.card = c; state.nfl = n; })
  .then(() => fetch("projections.json", { cache: "no-store" }))
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { state.data = d; render(); })
  .catch(() => {
    if (SAMPLE) { state.data = SAMPLE; render(); }
    else empty("Couldn't find projections.json in this folder.");
  });
</script>
</body>
</html>
