        return `<div class="gm-row">
          <span class="mu2">${g.away} at ${g.home}</span>
          <span class="sc">${sa == null ? "—"
            : `${Math.round(sa)}&ndash;${Math.round(sh)}`}
            ${g.pred_total != null ? `<br><small>o/u ${g.pred_total.toFixed(0)}</small>` : ""}</span>
          <span class="pk">${g.pick}</span>
          <span class="n cf">${Math.round(g.confidence * 100)}%</span>
          <span class="n">
            <span>${margin > 0 ? "+" : ""}${margin.toFixed(1)}</span><br>
            <span class="vg${split ? " split" : ""}">${v == null ? ""
              : `line ${v > 0 ? "+" : ""}${v.toFixed(1)}`}</span>
          </span>
        </div>`;
      }).join("")}
    </div>
    ${pickParlays(state.games, "nfl")}
    <p class="cal-key">Score is away&ndash;home, with the projected game total
      beneath it. Margin is from the home team's side, with the Vegas line
      under it in red where the two disagree on the winner. The winner comes
      from team ratings; the total is a weaker signal, beating a flat league
      average by only a quarter of a point.</p>`;
}

function projFor(name) {
  const p = state.recProj;
  if (!p || !p.players) return null;
  const norm = s => s.toLowerCase().replace(/[.'`-]/g, "")
    .split(" ").filter(w => !["jr","sr","ii","iii","iv"].includes(w)).join(" ");
  const k = norm(name);
  return p.players.find(x => norm(x.player) === k) || null;
}

function nflGraded() {
  const c = state.nflScore;
  if (!c || !c.scored) {
    return `<div class="empty"><h2>Nothing graded yet</h2>
      <p>Captured lines get checked against real results once games have
      been played. This fills in after the first week completes.</p></div>`;
  }

  const q = state.q.toLowerCase();
  const rows = (c.results || []).filter(r => !q
    || r.player.toLowerCase().includes(q)
    || r.matchup.toLowerCase().includes(q));

  const cal = c.calibration && c.calibration.length
    ? `<p class="cal-key">Calibration: ${c.calibration.map(b =>
        `${Math.round(b.says * 100)}% said, ${Math.round(b.happened * 100)}%
         happened (${b.n})`).join(" · ")}. Those pairs should track each
         other if the books' prices are honest.</p>`
    : "";

  return `
    <dl class="totals">
      <div class="t"><dt>Lines graded</dt><dd>${c.scored}</dd></div>
      <div class="t"><dt>Market's error</dt><dd>${c.market_mae}
        <small>receptions</small></dd></div>
      <div class="t"><dt>Real spread</dt><dd>${c.sd_actual}
        <small>SD</small></dd></div>
      <div class="t"><dt>Overs hit</dt><dd>${Math.round(c.over_rate * 100)}%
        <small>50% is efficient</small></dd></div>
    </dl>
    <p class="caption" style="max-width:60ch">This grades the books, not a
      model — there isn't one for receptions. Their error of ${c.market_mae}
      is the bar anything would have to beat. For scale, a season average
      scored 1.49 and the best model I could build on 2025 scored 1.51, both
      worse than the market.</p>
    ${cal}
    <div class="rs-head">
      <span>Player</span><span>Wk</span><span>Line</span><span>Got</span><span></span>
    </div>
    ${rows.length ? rows.map(r => `
      <div class="rs-row">
        <span class="nm">${r.player}</span>
        <span class="n">${r.week}</span>
        <span class="n">${r.line}</span>
        <span class="n act">${r.actual}</span>
        <span class="res ${r.over ? "o" : "u"}">${r.over ? "OVER" : "under"}</span>
      </div>`).join("")
      : `<p class="caption">Nothing matches "${state.q}".</p>`}`;
}

function nflView() {
  const d = state.nfl;
  if (!d || !d.games || !d.games.length) {
    return `<div class="empty"><h2>No reception lines yet</h2>
      <p>Lines are captured a few hours before each kickoff. This fills in
      once the first game is collected.</p></div>`;
  }
  const weeks = (d.weeks && d.weeks.length) ? d.weeks : [];
  // "all" is a valid choice, not a stale week number.
  if (state.nflWeek != null && state.nflWeek !== "all"
      && !weeks.includes(state.nflWeek)) state.nflWeek = null;
  const latest = weeks.length ? Math.max(...weeks) : null;
  const pick = state.nflWeek != null ? state.nflWeek : latest;

  const picker = weeks.length > 1 ? `<div class="daypick">
      <label for="wsel">Week</label>
      <select id="wsel">
        ${weeks.slice().reverse().map(w =>
          `<option value="${w}"${w === pick ? " selected" : ""}>Week ${w}</option>`).join("")}
        <option value="all"${state.nflWeek === "all" ? " selected" : ""}>All weeks</option>
      </select>
    </div>` : "";

  const q = state.q.toLowerCase();
  let shown = 0;
  const inWeek = g => state.nflWeek === "all" || pick == null
    || g.week == null || g.week === pick;

  const html = d.games.filter(inWeek).map(g => {
    const ps = g.players.filter(p => !q || p.player.toLowerCase().includes(q)
                                      || g.matchup.toLowerCase().includes(q));
    if (!ps.length) return "";
    shown += ps.length;
    return `<div class="nfl-game">
      <h3>${g.matchup}</h3>
      <div class="when">${g.week ? `Week ${g.week} · ` : ""}${g.players.length} players · ${g.snapshots} snapshot${g.snapshots === 1 ? "" : "s"}</div>
      ${ps.map(p => {
        const best = Math.max(p.shop_over, p.shop_under);
        const side = p.shop_over >= p.shop_under ? "over" : "under";
        return `<div class="nfl-row">
          <span class="nm">${p.player}</span>
          <span class="ln">${p.line}</span>
          <span class="px">${(() => { const pr = projFor(p.player);
            return pr ? `<span class="proj">${pr.proj.toFixed(1)} proj</span> · ` : ""; })()}books say ${pct(p.consensus_over)} over ·
            best over <b>${p.best_over.price > 0 ? "+" : ""}${p.best_over.price}</b>
            ${p.best_over.book}
            ${best >= 3 ? `· <span class="shop" title="Widest price gap between
              books is on the ${side} — this is a shopping saving, not a pick"
              >$${best.toFixed(0)} to shop the ${side}</span>` : ""}
          </span>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  const pj = state.recProj;
  const note = pj && pj.players && pj.players.length
    ? `<div class="projnote">The green number is this model's projection,
        beside the line. Measured honestly: on a clean out-of-sample test it
        missed by <b>${pj.honesty.model_mae}</b> receptions against
        <b>${pj.honesty.baseline_mae}</b> for just using a player's season
        average — so it's slightly better than guessing. The books missed by
        <b>${pj.honesty.market_mae}</b>, so it is <b>not</b> better than the
        line. Read it as context, not as an edge.</div>`
    : `<div class="projnote">Projections start in Week 6 — the model needs
        five games of current-season form before it will guess. Until then
        this tab is line comparison only.</div>`;

  return `${note}<p class="caption" style="max-width:58ch"><b>Nothing here is a
    pick.</b> Every percentage is the books' own number with their margin
    removed — not a forecast. The dollar figure is what taking the best
    available price instead of the worst is worth per $100 on that side; it
    says where shopping pays, not which way to bet. There is no reception
    model, because the one I tested lost to a season average.</p>
    ${picker}
    ${html || `<div class="empty"><p>${state.q
      ? `Nothing matches "${state.q}".`
      : "No games captured for this week yet."}</p></div>`}`;
}

function pitcherView(name) {
  const all = ((state.card && state.card.results) || [])
    .filter(r => r.pitcher === name);
  const rows = all.slice(0, 10);

  let body;
  if (!rows.length) {
    body = `<p class="psum">No graded starts for ${name} yet. Results appear
      the morning after each game.</p>`;
  } else {
    const errs = rows.map(r => Math.abs(r.err ?? (r.proj - r.actual)));
    const mae = errs.reduce((a, b) => a + b, 0) / errs.length;
    const high = rows.filter(r => r.proj > r.actual).length;
    const withLine = rows.filter(r => r.line != null);
    const hits = withLine.filter(r => r.hit).length;
    const max = Math.max(...rows.map(r => Math.max(r.proj, r.actual)), 8);
    const bfs = rows.filter(r => r.bf).map(r => r.bf);
    const avgBf = bfs.length ? bfs.reduce((a, b) => a + b, 0) / bfs.length : null;
    const ks = rows.map(r => r.actual);
    const avgK = ks.reduce((a, b) => a + b, 0) / ks.length;

    body = `
      <p class="psum">Last ${rows.length} graded start${rows.length === 1 ? "" : "s"}:
        averaging <b>${avgK.toFixed(1)}</b> strikeouts${avgBf
          ? ` on <b>${avgBf.toFixed(1)}</b> batters faced` : ""}.
        Model missed by ${mae.toFixed(2)} on average, projected high on ${high} of
        ${rows.length}.${withLine.length
          ? ` Its side hit ${hits} of ${withLine.length} times.` : ""}</p>
      <div class="phead-row">
        <span>Date</span><span></span><span>Proj</span><span>K</span>
        <span class="bfh">BF</span>
      </div>
      <div class="pbars">
        ${rows.map(r => {
          const pw = (r.proj / max) * 100, aw = (r.actual / max) * 100;
          return `<div class="pbar">
            <span class="dt">${r.date.slice(5)}</span>
            <span class="track">
              <span class="pj" style="left:0;width:${pw.toFixed(1)}%"></span>
              <span class="ac" style="left:${aw.toFixed(1)}%;width:2px"></span>
            </span>
            <span class="n">${r.proj.toFixed(1)}</span>
            <span class="n act">${r.actual}</span>
            <span class="bf">${r.bf || "—"}</span>
          </div>`;
        }).join("")}
      </div>
      <p class="cal-key">Bar is the projection, red mark is what he actually
        threw. ${all.length > 10 ? `${all.length} starts on record, showing 10.` : ""}</p>`;
  }

  return `<button class="pback" id="pb">&larr; back</button>
    <h2 class="phead">${name}</h2>${body}`;
}

function results() {
  const rows = (state.card && state.card.results) || [];
  if (!rows.length) {
    return `<div class="empty"><h2>No results yet</h2>
      <p>Each day gets graded the following morning, once the games have
      finished. Check back tomorrow.</p></div>`;
  }

  const allDays = [...new Set(rows.map(r => r.date))].sort().reverse();
  if (state.day && !allDays.includes(state.day)) state.day = null;
  const shown = state.day ? rows.filter(r => r.date === state.day) : rows;

  const picker = `<div class="daypick">
      <label for="dsel">Day</label>
      <select id="dsel">
        <option value=""${state.day ? "" : " selected"}>All ${allDays.length} days</option>
        ${allDays.map(d => `<option value="${d}"${state.day === d ? " selected" : ""}
          >${prettyDate(d)}</option>`).join("")}
      </select>
      ${state.day ? `<button id="dclear">show all</button>` : ""}
    </div>`;

  const withLine = shown.filter(r => r.line != null);
  const hits = withLine.filter(r => r.hit).length;
  const closer = withLine.filter(r => r.closer).length;

  const days = [];
  let cur = null;
  for (const r of shown) {
    if (!cur || cur.date !== r.date) { cur = { date: r.date, rows: [] }; days.push(cur); }
    cur.rows.push(r);
  }

  const head = `<div class="res-head">
      <span>Pitcher</span><span>Proj</span><span>Actual</span>
      <span class="bf">Line</span><span></span></div>`;

  return `
    ${picker}
    <p class="caption" style="max-width:58ch">${state.day
      ? `${shown.length} start${shown.length === 1 ? "" : "s"} on this day.`
      : "Every graded start, newest first."}
      ${withLine.length ? `Where a line existed, the model's side came in
      ${hits} of ${withLine.length} times, and its projection was closer to the
      real number than the line was on ${closer}.` : ""}</p>
    ${recordBlock()}
    ${seasonTotals()}
    ${calendar()}
    ${scatter()}
    <div class="res">
      ${days.map(d => `
        <div class="res-day">${prettyDate(d.date)}</div>
        ${head}
        ${d.rows.map(r => `
          <div class="res-row">
            <span class="nm plink" data-pitcher="${r.pitcher}">${r.pitcher}</span>
            <span class="n">${r.proj.toFixed(1)}</span>
            <span class="n got">${r.actual}</span>
            <span class="n bf">${r.line != null ? r.line : "—"}</span>
            <span>${r.line != null
              ? `<span class="tag ${r.hit ? "win" : "miss"}">${r.side}
                 ${r.hit ? "hit" : "miss"}</span>`
              : ""}</span>
          </div>`).join("")}`).join("")}
    </div>`;
}

function scorecard() {
  const c = state.card;
  if (!c || !c.starts) {
    return `<div class="card"><h2>Accuracy</h2>
      <p class="note">Nothing graded yet. Each finished day gets scored against
      the real results; come back after a couple of weeks.</p></div>`;
  }

  const m = c.market;
  const rate = m && m.win_rate != null ? m.win_rate : null;
  const thin = c.starts < 150;

  return `<div class="card">
    <h2>Accuracy over ${c.days} day${c.days === 1 ? "" : "s"},
        ${c.starts} start${c.starts === 1 ? "" : "s"}</h2>
    <div class="card-row">
      <span>My error <b>${c.mae_model}</b></span>
      <span>Season-average baseline <b>${c.mae_naive}</b></span>
      ${m ? `<span>The books <b>${m.mae_book}</b></span>` : ""}
    </div>
    <div class="card-row">
      <span>Strikeout bias <b>${c.bias_k > 0 ? "+" : ""}${c.bias_k}</b></span>
      <span>Batters faced <b>${c.bias_bf > 0 ? "+" : ""}${c.bias_bf}</b></span>
      <span>Real spread <b>${c.sd_actual}</b></span>
    </div>
    ${rate != null ? `<div class="card-row"><span class="headline">
      Disagreed with the books by a full strikeout ${m.disagreements} times,
      and was closer on ${Math.round(rate * 100)}% of them.</span></div>` : ""}
    <p class="note">${thin
      ? `Under 150 starts, a gap this size is indistinguishable from luck. Keep collecting.`
      : (rate != null && rate <= 0.5
        ? `Losing the disagreements. The gaps flagged on the slate are this model's
           blind spots rather than anything the market missed.`
        : `Ahead of the baseline. The disagreement rate is the number that decides
           whether the flagged gaps mean anything.`)}</p>
  </div>`;
}

/* ---------- price checker ---------- */

const toDecimal = p => (p > 0 ? 1 + p / 100 : 1 + 100 / -p);
const breakEven = p => 1 / toDecimal(p);
const fmtPrice = p => (p > 0 ? "+" : "") + p;

function calcPanel() {
  const names = state.data
    ? state.data.starters.map(s => s.pitcher).sort()
    : [];
  return `<div class="calc">
    <h2>Check a price</h2>
    <p class="sub">Enter a price you've been offered. This shows the arithmetic:
      what the price needs to be worth taking, what the market thinks, and
      whether a better number exists elsewhere.</p>
    <div class="calc-in">
      <div class="fld">
        <label for="c-name">Pitcher</label>
        <input id="c-name" type="text" list="c-list" placeholder="Any name" autocomplete="off">
        <datalist id="c-list">${names.map(n => `<option value="${n}">`).join("")}</datalist>
      </div>
      <div class="fld">
        <label for="c-side">Side</label>
        <select id="c-side"><option>Over</option><option>Under</option></select>
      </div>
      <div class="fld">
        <label for="c-line">Line</label>
        <input id="c-line" type="number" step="0.5" placeholder="5.5">
      </div>
      <div class="fld">
        <label for="c-odds">Odds</label>
        <input id="c-odds" type="number" step="5" placeholder="-115">
      </div>
      <div class="fld">
        <label for="c-other">Other side <span style="opacity:.6">(optional)</span></label>
        <input id="c-other" type="number" step="5" placeholder="-105">
      </div>
    </div>
    <div class="calc-out" id="c-out"></div>
  </div>`;
}

function runCalc() {
  const name = document.getElementById("c-name").value.trim();
  const side = document.getElementById("c-side").value;
  const line = parseFloat(document.getElementById("c-line").value);
  const odds = parseFloat(document.getElementById("c-odds").value);
  const other = parseFloat(document.getElementById("c-other").value);
  const out = document.getElementById("c-out");

  if (!odds || Math.abs(odds) < 100) { out.innerHTML = ""; return; }

  const be = breakEven(odds);
  let html = `<div class="line">
      <span>Pays <b>${fmtPrice(odds)}</b></span>
      <span>Needs <b>${(be * 100).toFixed(1)}%</b> to break even</span>
    </div>`;

  // If both sides given, the vig can be stripped without any model at all.
  if (other && Math.abs(other) >= 100) {
    const a = breakEven(odds), b = breakEven(other);
    const fair = a / (a + b);
    html += `<div class="line">
      <span>Fair after vig <b>${(fair * 100).toFixed(1)}%</b></span>
      <span>Book's margin <b>${((a + b - 1) * 100).toFixed(1)}%</b></span>
    </div>`;
  }

  // Anything below needs the pitcher to be on today's slate.
  const s = state.data && state.data.starters.find(
    x => x.pitcher.toLowerCase() === name.toLowerCase());

  if (s && !isNaN(line)) {
    const threshold = Math.floor(line) + 1;
    const pOver = s.pmf.slice(threshold).reduce((a, b) => a + b, 0);
    const mine = side === "Over" ? pOver : 1 - pOver;
    const ev = mine * (toDecimal(odds) - 1) - (1 - mine);

    html += `<div class="line">
        <span>My model <b>${(mine * 100).toFixed(1)}%</b></span>
        <span>Edge over break-even
          <b>${((mine - be) * 100).toFixed(1)} pts</b></span>
        <span>EV <b>${(ev * 100).toFixed(1)}%</b></span>
      </div>`;

    const m = s.market;
    if (m) {
      const mkt = side === "Over" ? m.consensus_over : 1 - m.consensus_over;
      html += `<div class="line">
          <span>Market line <b>${m.line}</b></span>
          <span>Market <b>${(mkt * 100).toFixed(1)}%</b>
            across ${m.books} book${m.books === 1 ? "" : "s"}</span>
        </div>`;

      // Line shopping - the one edge that doesn't depend on any model.
      const best = side === "Over" ? m.best_over : m.best_under;
      if (best && m.line === line) {
        const gain = (toDecimal(best.price) - toDecimal(odds)) * 100;
        html += gain > 0.5
          ? `<div class="shop"><b>${best.book} has ${fmtPrice(best.price)}</b>
             on the same line — about $${gain.toFixed(0)} more per $100 staked,
             for the same bet. This part doesn't depend on the model being right.</div>`
          : `<div class="shop">That's the best price I found across
             ${m.books} book${m.books === 1 ? "" : "s"}.</div>`;
      }
    }

    html += `<p class="verdict">The model has not been graded against results
      yet, so treat the EV figure as a disagreement with the market rather
      than an edge over it. The break-even and vig figures above are just
      arithmetic and hold regardless.</p>`;
  } else if (name) {
    html += `<p class="verdict">${name} isn't on today's slate, so there's no
      model number for him — but the break-even${other ? " and vig" : ""}
      arithmetic above applies to any bet in any sport.</p>`;
  } else {
    html += `<p class="verdict">Add a pitcher from today's slate and a line to
      compare against the model and check for a better price.</p>`;
  }

  out.innerHTML = html;
}

function curWeekCount(src) {
  if (!src || !src.games || !src.games.length) return null;
  const wk = Math.min(...src.games.map(g => g.week));
  return src.games.filter(g => g.week === wk).length;
}

/* ================= parlay suggestions ================= */

// Legs are {id, who, what, p, game}. Combining assumes the legs are
// independent, which holds across different games and does not hold within
// one - so same-game pairs are never suggested.
function buildParlays(legs, opts) {
  opts = opts || {};
  // Draw the best from EACH market rather than the best overall. Sorted
  // globally, the top fourteen legs were all threes - that market has the
  // tightest spread, so it monopolises the confident end and every slip
  // came out as the same bet five times.
  const ok = legs.filter(l => l.p != null && l.p > 0.02 && l.p < 0.985)
                 .sort((a, b) => b.p - a.p);
  const byKind = {};
  ok.forEach(l => (byKind[l.kind || "x"] = byKind[l.kind || "x"] || []).push(l));
  const kinds = Object.keys(byKind);
  const want = opts.pool || 16;
  const pool = [];
  for (let i = 0; pool.length < want && i < 40; i++) {
    let added = false;
    for (const k of kinds) {
      if (byKind[k][i]) { pool.push(byKind[k][i]); added = true; }
      if (pool.length >= want) break;
    }
    if (!added) break;
  }
  if (pool.length < 2) return [];

  const clash = (a, b) => a.game && b.game && a.game === b.game;
  const pick = (from, size) => {
    // One leg per player, and spread across markets where there is a
    // choice. Without this every slip came out as three of the same bet -
    // the highest-probability legs all cluster in one market.
    const out = [];
    for (const pass of [true, false]) {
      for (const l of from) {
        if (out.length >= size) break;
        if (out.some(o => clash(o, l) || o.who === l.who)) continue;
        if (pass && l.kind && out.some(o => o.kind === l.kind)) continue;
        out.push(l);
      }
      if (out.length >= size) break;
    }
    return out.length === size ? out : null;
  };

  // A spread of shapes rather than five versions of "the favourites".
  const recipes = [
    ["Shortest double", pool, 2],
    ["Shortest treble", pool, 3],
    ["Mid-range treble", pool.slice(3), 3],
    ["Longer treble", pool.slice(6), 3],
    ["Outside double", pool.slice(8), 2],
  ];

  const seen = new Set();
  const out = [];
  for (const [label, from, size] of recipes) {
    const legsPicked = pick(from, size);
    if (!legsPicked) continue;
    const key = legsPicked.map(l => l.id).sort().join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    out.push({
      label,
      legs: legsPicked,
      p: legsPicked.reduce((x, l) => x * l.p, 1),
    });
  }
  return out;
}

function parlayBlock(title, legs, note) {
  const slips = buildParlays(legs);
  if (!slips.length) {
    return `<div class="par"><h2>${title}</h2>
      <p class="sub">Needs at least two qualifying legs in different games.</p></div>`;
  }
  return `<div class="par">
    <h2>${title}</h2>
    <p class="sub">${note} Confidence is the chance <b>every</b> leg lands,
      assuming the games are independent — which is why no two legs here
      come from the same game. There are no odds collected for this market,
      so there is no payout or expected value, only the probability.</p>
    ${slips.map(s => `<div class="slip">
      <div class="n">${s.label} &middot; ${s.legs.length} legs</div>
      ${s.legs.map(l => `<div class="leg">
        <span class="who">${l.who}</span>
        <span>${l.what}</span>
        <span class="bk">${Math.round(l.p * 100)}%</span>
      </div>`).join("")}
      <div class="tot">
        <span>Confidence <b>${(s.p * 100).toFixed(1)}%</b></span>
        <span class="bk">about 1 in ${Math.max(1, Math.round(1 / s.p))}</span>
      </div>
    </div>`).join("")}
    <p class="cal-key">Each extra leg multiplies the risk: a treble of three
      60% legs lands about one time in five. The confidence figure is doing
      that arithmetic for you.</p>
  </div>`;
}

// Only quote where the probability has actually been validated. Outside
// 25-75% the thin markets drift badly - threes said 93% and landed 56%.
// A book posts props on players who matter. Without a floor, this
// suggested "under 0.5 assists" for deep bench players - trivially likely,
// and not a line anyone offers.
const MIN_PROJ = { pra: 15, points: 8, rebounds: 3, assists: 2, threes: 1, "": 1.5 };

function overLegs(players, markets, gameOf, idOf) {
  const legs = [];
  for (const p of players) {
    for (const [key, label] of markets) {
      const prob = key ? p[key + "_pover"] : p.p_over;
      const line = key ? p[key + "_line"] : p.line;
      const proj = key ? p[key] : p.proj;
      if (prob == null || line == null) continue;
      if (proj == null || proj < (MIN_PROJ[key] ?? 1)) continue;
      const over = prob >= 0.5;
      const q = over ? prob : 1 - prob;
      if (q < 0.5 || q > 0.75) continue;
      legs.push({
        id: idOf(p) + ":" + key,
        who: p.player, game: gameOf(p), kind: key || "shots",
        what: `${over ? "over" : "under"} ${line} ${label}`,
        p: q,
      });
    }
  }
  return legs;
}

function tdParlays() {
  const d = state.td;
  if (!d || !d.players) return "";
  return parlayBlock("Suggested parlays",
    d.players.map(p => ({
      id: p.player + p.team, who: p.player, game: p.game,
      what: `anytime TD vs ${p.opponent}`, p: p.p_any,
    })),
    "Anytime touchdown legs, drawn from the model's own probabilities.");
}

function nhlParlays() {
  const d = state.nhl;
  if (!d || !d.players) return "";
  const gameOf = p => [p.team, p.opponent].sort().join("@");
  const shots = overLegs(d.players, [["", "shots"]], gameOf,
                         p => String(p.player_id));
  const goals = d.players.map(p => ({
    id: p.player_id + ":g", who: p.player, game: gameOf(p), kind: "goal",
    what: `goal vs ${p.opponent}`, p: p.p_goal,
  }));
  return parlayBlock("Suggested parlays", goals.concat(shots),
    "Anytime goalscorer legs mixed with shot overs and unders at the " +
    "half-point line.");
}

function nbaParlays() {
  const d = state.nba;
  if (!d || !d.players) return "";
  const gameOf = p => [p.team, p.opponent].sort().join("@");
  const legs = overLegs(d.players,
    [["pra", "PRA"], ["points", "points"], ["rebounds", "rebounds"],
     ["assists", "assists"], ["threes", "threes"]],
    gameOf, p => String(p.athlete_id));
  if (!legs.length) return "";
  return parlayBlock("Suggested parlays", legs,
    "Over and under legs at the half-point line beside each projection. " +
    "The probability comes from the model's own miss distribution, " +
    "measured rather than assumed — a normal curve fits PRA well and is " +
    "badly wrong for threes.");
}

function nbaFirstParlays() {
  const d = state.nba;
  if (!d || !d.players) return "";
  const legs = d.players.filter(p => p.p_first != null).map(p => ({
    id: String(p.athlete_id), who: p.player,
    game: [p.team, p.opponent].sort().join("@"),
    what: `first point vs ${p.opponent}`, p: p.p_first,
  }));
  if (!legs.length) return "";
  return parlayBlock("First-point parlays", legs,
    "Long by nature — ten starters compete for the opening basket, so even " +
    "the favourite is around 14%.");
}

function pickParlays(src, label) {
  if (!src || !src.games || !src.games.length) return "";
  const wk = Math.min(...src.games.map(g => g.week));
  return parlayBlock("Suggested parlays",
    src.games.filter(g => g.week === wk).map(g => ({
      id: g.away + g.home, who: g.pick,
      game: g.away + g.home,
      what: `to beat ${g.pick === g.home ? g.away : g.home}`,
      p: g.confidence,
    })),
    `${label === "cfb" ? "College" : "NFL"} winners for week ${wk}, straight ` +
    `up rather than against the spread.`);
}

// ESPN's public scoreboard endpoints - no key, no account. Undocumented
// and unofficial, so every field is read defensively and a failure shows
// a plain message rather than breaking the tab.
const LEAGUES = [
  ["nfl", "NFL", "football/nfl"],
  ["cfb", "College", "football/college-football"],
  ["nba", "NBA", "basketball/nba"],
  ["nhl", "NHL", "hockey/nhl"],
  ["mlb", "MLB", "baseball/mlb"],
];

function fetchScores(key) {
  const path = (LEAGUES.find(l => l[0] === key) || [])[2];
  if (!path) return;
  state.scores[key] = { loading: true };
  const extra = key === "cfb" ? "?groups=50&limit=200" : "";
  // Wrapped: a throw here would otherwise take the whole render down with
  // it, and this is the one thing on the page that depends on a live
  // third-party feed.
  let req;
  try {
    req = fetch(`https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard${extra}`,
                { cache: "no-store" });
  } catch (e) {
    state.scores[key] = { error: String(e) };
    return;
  }
  req
    .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(d => {
      state.scores[key] = { at: Date.now(), events: (d && d.events) || [] };
      if (state.view === "scores") render();
    })
    .catch(e => {
      state.scores[key] = { error: String(e) };
      if (state.view === "scores") render();
    });
}

function sbSide(c, other) {
  const score = c && c.score != null ? Number(c.score) : null;
  const os = other && other.score != null ? Number(other.score) : null;
  const cls = score == null || os == null ? ""
    : score > os ? " win" : score < os ? " lose" : "";
  const t = (c && c.team) || {};
  return `<div class="side${cls}">
    <span class="nm">${t.shortDisplayName || t.displayName || t.abbreviation || "—"}
      ${(c && c.records && c.records[0] && c.records[0].summary)
        ? `<span style="font-size:0.72rem;color:var(--ink-soft)">
           ${c.records[0].summary}</span>` : ""}</span>
    <span class="sc">${score == null ? "—" : score}</span>
  </div>`;
}

function scoresView() {
  const key = state.league2;
  const s = state.scores[key];
  const label = (LEAGUES.find(l => l[0] === key) || [])[1] || "";

  if (!s || s.loading) {
    return `<p class="sb-note">Loading ${label} scores…</p>`;
  }
  if (s.error) {
    return `<div class="empty"><h2>Couldn't reach the scores</h2>
      <p>ESPN's scoreboard didn't answer (${s.error}). It's an unofficial
      feed, so it goes down occasionally. Nothing else on this page depends
      on it.</p></div>`;
  }
  if (!s.events.length) {
    return `<p class="sb-note">No ${label} games today.</p>`;
  }

  const live = s.events.filter(e =>
    ((e.status || {}).type || {}).state === "in").length;

  return `
    ${live ? `<p class="cal-key"><b>${live} game${live === 1 ? "" : "s"}
      in progress.</b> Refreshing every half minute while you watch.</p>` : ""}
    <div class="sb">
      ${s.events.map(e => {
        const comp = (e.competitions || [])[0] || {};
        const cs = comp.competitors || [];
        const home = cs.find(c => c.homeAway === "home") || cs[0];
        const away = cs.find(c => c.homeAway === "away") || cs[1];
        const stt = (e.status || {}).type || {};
        const inPlay = stt.state === "in";
        const done = stt.state === "post";
        const when = e.date
          ? new Date(e.date).toLocaleTimeString(undefined,
              { hour: "numeric", minute: "2-digit" })
          : "";
        return `<div class="sb-row">
          <div>${sbSide(away, home)}${sbSide(home, away)}</div>
          <div class="st">${
            inPlay ? `<span class="live">${(e.status || {}).displayClock || "LIVE"}</span>
                      ${stt.shortDetail ? stt.shortDetail.split(" - ").pop() : ""}`
            : done ? `<span class="final">Final</span>`
            : when}</div>
        </div>`;
      }).join("")}
    </div>
    <p class="sb-stale">Scores from ESPN's public feed, fetched by your
      browser. Updated ${s.at ? new Date(s.at).toLocaleTimeString(undefined,
      { hour: "numeric", minute: "2-digit", second: "2-digit" }) : "just now"}.</p>`;
}

function homeView() {
  const t = [];

  // strikeouts
  if (state.data && state.data.starters.length) {
    const top = [...state.data.starters].sort((a, b) => b.proj_k - a.proj_k).slice(0, 3);
    const c = state.card || {};
    t.push(tile("slate", "Strikeouts",
      `${state.data.starters.length} pitchers · ${prettyDate(state.data.date)}`,

      c.market && c.market.win_rate != null
        ? `Beat the book on <span class="bad">${Math.round(c.market.win_rate * 100)}%</span>
           of disagreements`
        : "Season complete"));
  } else {
    t.push(idleTile("slate", "Strikeouts", "No slate — the MLB season is over."));
  }

  // receptions
  if (state.nfl && state.nfl.totals && state.nfl.totals.games) {
    const best = [];
    (state.nfl.games || []).forEach(g => (g.players || []).forEach(p =>
      best.push([p.player, Math.max(p.shop_over, p.shop_under)])));
    best.sort((a, b) => b[1] - a[1]);
    t.push(tile("nfl", "Reception lines",
      `${state.nfl.totals.games} games · ${state.nfl.totals.players} players`,
      best.slice(0, 3).map(([n, v]) => [n, "$" + v.toFixed(0)]),
      "Biggest price gaps between books, per $100"));
  } else {
    t.push(idleTile("nfl", "Reception lines", "Nothing captured yet."));
  }

  // game picks
  const gp = state.games && state.games.results;
  if (state.games && (state.games.games || []).length) {
    const wk = Math.min(...state.games.games.map(g => g.week));
    const top = state.games.games.filter(g => g.week === wk)
      .sort((a, b) => b.confidence - a.confidence).slice(0, 3);
    t.push(tile("picks", "NFL games", `Week ${wk} · ${
      state.games.games.filter(g => g.week === wk).length} games`,
      top.map(g => [g.pick, Math.round(g.confidence * 100) + "%"]),
      gp && gp.graded
        ? `<span class="good">${gp.won}&ndash;${gp.lost}</span> this season,
           baseline ${Math.round(gp.home_baseline * 100)}%`
        : "Not graded yet"));
  } else {
    t.push(idleTile("picks", "NFL games", "No games loaded."));
  }

  // college
  const cp = state.cfb && state.cfb.results;
  if (state.cfb && (state.cfb.games || []).length) {
    const wk = Math.min(...state.cfb.games.map(g => g.week));
    const games = state.cfb.games.filter(g => g.week === wk);
    t.push(tile("picks", "College games", `Week ${wk} · ${games.length} games`,
      games.sort((a, b) => b.confidence - a.confidence).slice(0, 3)
        .map(g => [g.pick.slice(0, 20), Math.round(g.confidence * 100) + "%"]),
      cp && cp.graded
        ? `<span class="good">${cp.won}&ndash;${cp.lost}</span>, baseline
           ${Math.round(cp.home_baseline * 100)}%`
        : "Not graded yet"));
  }

  // touchdowns
  if (state.td && (state.td.players || []).length) {
    const top = [...state.td.players].sort((a, b) => b.p_any - a.p_any).slice(0, 3);
    const g = state.tdGrade;
    t.push(tile("td", "Touchdowns", `Week ${state.td.week} · ${
      state.td.players.length} players`,
      top.map(p => [p.player, Math.round(p.p_any * 100) + "%"]),
      g && g.graded
        ? `Brier <span class="good">${g.brier}</span> vs ${g.brier_base} base rate`
        : "Beats the base rate on a clean test"));
  } else {
    t.push(idleTile("td", "Touchdowns", "Not built yet."));
  }

  // nba
  if (state.nba && (state.nba.players || []).length) {
    const top = [...state.nba.players].sort((a, b) => b.pra - a.pra).slice(0, 3);
    t.push(tile("nba", "NBA", `${(state.nba.games || []).length} games · ${
      state.nba.players.length} players`,
      top.map(p => [p.player, p.pra.toFixed(1) + " PRA"]),
      `PRA error <span class="good">${(state.nba.honesty.mae || {}).pra}</span>
       vs ${(state.nba.honesty.mae_naive || {}).pra} season average`));
  } else {
    t.push(idleTile("nba", "NBA", "No slate loaded."));
  }

  // nhl
  if (state.nhl && (state.nhl.players || []).length) {
    const top = [...state.nhl.players].sort((a, b) => b.proj - a.proj).slice(0, 3);
    t.push(tile("nhl", "NHL", `${(state.nhl.games || []).length} games · ${
      state.nhl.players.length} skaters`,
      top.map(p => [p.player, p.proj.toFixed(2) + " SOG"]),
      `Shots error ${state.nhl.honesty.mae} vs ${state.nhl.honesty.mae_naive}
       — the slimmest edge here`));
  } else {
    t.push(idleTile("nhl", "NHL", "No slate loaded."));
  }

  return `<p class="caption" style="max-width:60ch">What is live right now,
    and how each model is measuring up. Every one of these is scored against
    a plain baseline and says so — the ones that do not beat it say that
    too.</p>
    <div class="home">${t.join("")}</div>`;
}

// One table renderer for every sport. Columns declare how to read and
// format a value; sorting and selection are handled here rather than
// reimplemented six times.
function dataTable(id, cols, rows, opts) {
  opts = opts || {};
  const s = state.tsort[id] || opts.sort || {};
  const key = s.key || opts.defaultKey || cols[1].key;
  const dir = s.dir || opts.defaultDir || "desc";
  const col = cols.find(c => c.key === key) || cols[1];

  const val = (r, c) => (c.sortValue ? c.sortValue(r) : r[c.key]);
  const sorted = [...rows].sort((a, b) => {
    const x = val(a, col), y = val(b, col);
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const n = typeof x === "number" && typeof y === "number"
      ? x - y : String(x).localeCompare(String(y));
    return dir === "desc" ? -n : n;
  }).slice(0, opts.limit || 200);

  if (!sorted.length) {
    return `<p class="dt-empty">${opts.empty || "Nothing to show."}</p>`;
  }

  return `<div class="dt-wrap"><table class="dt" data-table="${id}">
    <thead><tr>${cols.map(c => `
      <th data-col="${c.key}"${c.key === key
        ? ` aria-sort="${dir === "desc" ? "descending" : "ascending"}"` : ""}
        title="Sort by ${c.label}">${c.label}</th>`).join("")}</tr></thead>
    <tbody>${sorted.map(r => {
      const rid = opts.rowId ? opts.rowId(r) : "";
      const sel = state.selected && state.selected.id === rid;
      return `<tr data-row="${rid}"${sel ? ' aria-selected="true"' : ""}>${
        cols.map(c => `<td${c.lead ? ' class="lead"' : ""}>${
          c.render ? c.render(r) : (r[c.key] ?? "—")}</td>`).join("")}</tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

function sortClick(id, colKey) {
  // NOT state.sort - that already belongs to the strikeout slate control.
  const cur = state.tsort[id] || {};
  state.tsort[id] = cur.key === colKey
    ? { key: colKey, dir: cur.dir === "desc" ? "asc" : "desc" }
    : { key: colKey, dir: "desc" };
  render();
}

function wireTable(id, rows, rowId, onPick) {
  const el = document.querySelector(`table[data-table="${id}"]`);
  if (!el) return;
  el.querySelectorAll("thead th").forEach(th =>
    th.onclick = () => sortClick(id, th.dataset.col));
  el.querySelectorAll("tbody tr").forEach(tr =>
    tr.onclick = () => {
      const r = rows.find(x => String(rowId(x)) === tr.dataset.row);
      if (r) onPick(r);
    });
}

function openDrawer(kind, id, data) {
  const title = data.player || data.pitcher
    || (data.away ? `${data.away} at ${data.home}` : "Detail");
  const sub = kind === "game"
    ? `Week ${data.week ?? ""}`.trim()
    : [data.team, data.opponent ? (data.home ? "vs " : "at ") + data.opponent : ""]
        .filter(Boolean).join(" ");
  state.selected = { kind, id, data, title, sub };
  render();
}

function closeDrawer() { state.selected = null; render(); }

function drawerHTML() {
  const sel = state.selected;
  if (!sel) return { open: false, html: "" };
  const body = DRAWERS[sel.kind] ? DRAWERS[sel.kind](sel.data) : "";
  return {
    open: true,
    html: `<div class="drawer-head">
        <div><h2>${sel.title || "Detail"}</h2>
          ${sel.sub ? `<div class="who2">${sel.sub}</div>` : ""}</div>
        <button class="drawer-close" id="dclose" aria-label="Close">&times;</button>
      </div>${body}`,
  };
}

function mountDrawer() {
  const { open, html } = drawerHTML();
  const dr = document.getElementById("drawer");
  const sc = document.getElementById("scrim");
  if (!dr) return;
  dr.innerHTML = html;
  dr.classList.toggle("open", open);
  sc.classList.toggle("open", open);
  sc.onclick = closeDrawer;
  const x = document.getElementById("dclose");
  if (x) x.onclick = closeDrawer;
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.selected) closeDrawer();
});

      <span aria-hidden="true">·</span>
      <button data-sort="time" aria-pressed="${state.sort === "time"}">first pitch</button>
      <span style="margin-left:auto">View</span>
      <button data-layout="ledger" aria-pressed="${state.layout === "ledger"}">cards</button>
      <span aria-hidden="true">·</span>
      <button data-layout="compact" aria-pressed="${state.layout === "compact"}">table</button>
      <span aria-hidden="true">·</span>
      <button data-layout="matchup" aria-pressed="${state.layout === "matchup"}">matchups</button>
    </div>`;
  RAIL(viewBar, kBar, searchBar, slateControls);
  document.getElementById("body").innerHTML = `
    ${state.layout === "compact" ? compactView(rows)
      : state.layout === "matchup" ? matchupView(rows)
      : `<div class="ledger">
      ${rows.length ? rows.map(s => {
        const key = s.pitcher + s.opponent;
        const open = state.open.has(key);
        const vs = s.home ? "vs" : "at";
        return `
        <div class="entry" data-key="${key}" ${open ? "open-detail" : ""}>
          <button class="entry-head" aria-expanded="${open}">
            <span class="who">
              <span class="name">${s.pitcher}</span>
              <span class="matchup">${s.team} ${vs} ${s.opponent} · ${s.venue} · ${gameTime(s)}</span>
            </span>
            <span class="proj">${fmt1(s.proj_k)}</span>
            ${strip(s.pmf, s.proj_k, s.market ? s.market.line : null)}
          </button>
          ${detail(s)}
        </div>`;
      }).join("") : `<p class="caption">Nothing matches "${state.q}".</p>`}
    </div>`}`;

  document.getElementById("card").innerHTML = scorecard();
  document.getElementById("calc").innerHTML = calcPanel() + parlayPanel();
  ["c-name", "c-side", "c-line", "c-odds", "c-other"].forEach(id =>
    document.getElementById(id).addEventListener("input", runCalc));
  const stk = document.getElementById("stk");
  if (stk) stk.oninput = () => {
    state.stake = Math.max(1, parseFloat(stk.value) || 10);
    document.getElementById("calc").innerHTML = calcPanel() + parlayPanel();
    const el = document.getElementById("stk");
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    el.oninput = stk.oninput;
  };

  document.getElementById("footer").innerHTML =
    `Projections combine each pitcher's strikeout rate with the opposing lineup's,
     then apply it across the batters he's expected to face. A start has a standard
     deviation of roughly two and a half strikeouts, so treat any single number as
     the middle of a wide range.`;

  document.querySelectorAll(".controls button").forEach(b =>
    b.onclick = () => {
      if (b.dataset.layout) state.layout = b.dataset.layout;
      else state.sort = b.dataset.sort;
      render();
    });
  document.querySelectorAll(".nfl-views button[data-ktab]").forEach(b =>
    b.onclick = () => { state.kTab = b.dataset.ktab; render(); });
  document.querySelectorAll(".cmp-row, .mu-side").forEach(el =>
    el.onclick = () => { state.pitcher = el.dataset.pitcher; render(); });
  wire();
  const qc = document.getElementById("qc");
  if (qc && state.q) qc.textContent = `${rows.length} of ${d.starters.length}`;

  document.querySelectorAll(".entry-head").forEach(b => b.onclick = () => {
    const entry = b.closest(".entry"), key = entry.dataset.key;
    state.open.has(key) ? state.open.delete(key) : state.open.add(key);
    entry.toggleAttribute("open-detail");
    b.setAttribute("aria-expanded", state.open.has(key));
  });
}

function empty(reason) {
  document.getElementById("body").innerHTML = `
    <div class="empty">
      <h2>No slate loaded</h2>
      <p>${reason}</p>
      <p>Build today's file, then serve this folder so the page can read it:</p>
      <pre>python build_projections.py
python -m http.server 8000</pre>
      <p>Then open localhost:8000 in your browser. Opening the file directly
         won't work — browsers block pages on <code>file://</code> from reading
         other local files.</p>
    </div>`;
}

Promise.all([
  fetch("scorecard.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("receptions.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("receptions_score.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("nfl_games.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("cfb_games.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("receptions_proj.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("td_model.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("receptions_grade.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("td_grade.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("nba_model.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("nba_grade.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("nhl_model.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("nhl_grade.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([c, n, rs, gm, cf, rp, td, rg, tg, nb, ng, hk, hg]) => {
  state.card = c; state.nfl = n; state.nflScore = rs;
  state.games = gm; state.cfb = cf; state.recProj = rp;
  state.td = td; state.recGrade = rg; state.tdGrade = tg;
  state.nba = nb; state.nbaGrade = ng;
  state.nhl = hk; state.nhlGrade = hg;
})
  .then(() => fetch("projections.json", { cache: "no-store" }))
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { state.data = d; render(); })
  .catch(() => {
    if (SAMPLE) { state.data = SAMPLE; render(); }
    else empty("Couldn't find projections.json in this folder.");
  });

/* Installable, and usable with no signal. The shell is cached so it opens
   instantly; the data files go to the network first, because a stale
   projection is worse than a slow one. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
