name: Daily projections

on:
  # Wakes hourly; should_run.py fires it once a day at 10:00 am Central.
  # Hourly rather than a single fixed slot because GitHub's free scheduler
  # is best-effort - if the 10am slot is late or skipped, 11am catches it.
  # Checking costs nothing; only the odds fetch spends API credits.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
    inputs:
      force:
        description: "Rebuild even if today already has odds"
        required: false
        default: "false"

permissions:
  contents: write           # needed to commit the day's results back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests numpy

      - name: Is it time yet?
        id: gate
        env:
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: |
          if python3 should_run.py; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build projections
        if: steps.gate.outputs.go == 'yes'
        # Use the date the gate decided on. Without this the builder falls
        # back to the runner's UTC clock, which is a day ahead every evening.
        run: python3 build_projections.py "${{ steps.gate.outputs.day }}"

      - name: Fetch odds
        if: steps.gate.outputs.go == 'yes'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # add_odds.py reads the key from a file, so hand it over that way
          # rather than putting it on the command line where it would be
          # visible in the process list and the run log.
          printf '%s' "$ODDS_API_KEY" > "$HOME/.odds_api_key"
          chmod 600 "$HOME/.odds_api_key"
          python3 add_odds.py || echo "No odds this run - projections stand."

      - name: Score past days
        if: steps.gate.outputs.go == 'yes'
        run: python3 score.py --json || true

      - name: Publish
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add only what exists - git add on a missing path is fatal,
          # and scorecard.json won't exist until there's history to score.
          for f in projections.json scorecard.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d history ] && git add history/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Projections for $(date -u +%Y-%m-%d)"
            git push
          fi
