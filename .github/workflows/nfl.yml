name: NFL and college

# Runs hourly and captures each game once, a few hours before kickoff.
# A manifest in the repo tracks what's already been done, so most runs
# spend nothing. Cost works out at one credit per game per week.
#
# Separate from the MLB workflow because the trigger is different: MLB fires
# once at 10am, this watches continuously for kickoffs. It reads the day's
# games from the API rather than assuming which weekdays have football, so
# Wednesday openers, Friday specials and international games are all caught.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Capture games kicking off within this many hours"
        required: false
        default: "4"
      force_daily:
        description: "Run the daily jobs now (game picks, grading)"
        required: false
        default: "false"

permissions:
  contents: write

# Don't let two hourly runs overlap - they'd both read the same manifest
# and double-spend on the same games.
concurrency:
  group: nfl-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests numpy

      - name: Ignore build artefacts
        run: printf '__pycache__/\n*.pyc\n' > .git/info/exclude

      # Scoring pulls a season of nflverse data, so run it once a day rather
      # than on every hourly wake. 12:00 UTC is well after Monday night.
      - name: Should we run the daily jobs?
        id: sc
        env:
          FORCE: ${{ github.event.inputs.force_daily || 'false' }}
        run: |
          # These pull a season of nflverse data, so once a day is plenty.
          # 12:00 UTC is well after Monday night football finishes.
          if [ "$(date -u +%H)" = "12" ] || [ "$FORCE" = "true" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WINDOW: ${{ github.event.inputs.window || '4' }}
        run: python3 nfl_collect.py --window "$WINDOW"

      - name: Build the page data
        continue-on-error: true
        run: |
          if [ -d snapshots/receptions ]; then
            python3 nfl_build.py
          fi

      - name: Rebuild game predictions
        if: steps.sc.outputs.go == 'yes'
        continue-on-error: true
        run: |
          pip install nflreadpy sportsdataverse pandas pyarrow
          python3 nfl_games.py --json || echo "(NFL game model unavailable)"
          python3 cfb_games.py --json || echo "(college model unavailable)"

      - name: Grade captured lines
        if: steps.sc.outputs.go == 'yes'
        continue-on-error: true
        run: |
          pip install nflreadpy pandas pyarrow
          python3 nfl_score.py --json || echo "(nothing to grade yet)"

      - name: Publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull BEFORE staging. --autostash reapplies changes unstaged, so
          # pulling after git add leaves nothing to commit and the commit
          # fails. The MLB workflow shares this branch, so the pull is needed.
          git pull --rebase --autostash origin main || true

          for f in receptions.json receptions_score.json nfl_games.json cfb_games.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d snapshots ] && git add snapshots/

          if git diff --staged --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "NFL update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
