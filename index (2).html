<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strikeout projections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:      #EDF0E6;
    --paper-warm: #E4E9DA;
    --rule:       #C7CFB8;
    --ink:        #1B2733;
    --ink-soft:   #5D6B78;
    --bar:        #33513F;
    --bar-fade:   #8FA394;
    --pencil:     #A3301C;

    --gutter: clamp(1rem, 4vw, 2.5rem);
    --row-pad: 0.95rem;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 62rem;
    margin: 0 auto;
    padding: clamp(1.75rem, 5vw, 3.5rem) var(--gutter) 5rem;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1.5rem;
    padding-bottom: 0.9rem;
    border-bottom: 2px solid var(--ink);
  }

  .masthead h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.05;
  }

  .masthead .date {
    display: block;
    font-size: clamp(0.9rem, 2.2vw, 1.05rem);
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0;
    margin-top: 0.25rem;
  }

  .meta {
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-align: right;
  }

  /* ---------- notice ---------- */

  .notice {
    margin-top: 1.25rem;
    padding: 0.7rem 0.95rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--pencil);
    font-size: 0.88rem;
    color: var(--ink);
  }
  .notice code {
    font-family: inherit;
    font-weight: 600;
    background: rgba(27, 39, 51, 0.07);
    padding: 0.05em 0.35em;
    border-radius: 2px;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    margin: 1.5rem 0 0.35rem;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .controls button {
    font: inherit;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 0.15rem 0.1rem;
    cursor: pointer;
  }
  .controls button:hover { color: var(--ink); }
  .controls button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--pencil);
  }
  .controls button:focus-visible {
    outline: 2px solid var(--pencil);
    outline-offset: 3px;
  }

  /* ---------- ledger ---------- */

  .ledger { border-top: 1px solid var(--ink); }

  .entry { border-bottom: 1px solid var(--rule); }

  .entry-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 0 1.1rem;
    width: 100%;
    padding: var(--row-pad) 0;
    background: none;
    border: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  .entry-head:hover { background: rgba(51, 81, 63, 0.045); }
  .entry-head:focus-visible {
    outline: 2px solid var(--pencil);
    outline-offset: -2px;
  }

  .who { min-width: 0; }

  .name {
    font-size: clamp(1rem, 2.6vw, 1.18rem);
    font-weight: 600;
    letter-spacing: -0.012em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .matchup {
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .proj {
    font-size: clamp(1.5rem, 4.2vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
    text-align: right;
    font-feature-settings: "tnum";
  }

  .strip { display: block; }

  /* ---------- detail ---------- */

  .detail {
    display: none;
    padding: 0.35rem 0 1.6rem;
  }
  .entry[open-detail] .detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 1.1rem 1.5rem;
    padding: 1.1rem 0 1.4rem;
    border-top: 1px dashed var(--rule);
  }

  .fact dt {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0 0 0.15rem;
  }
  .fact dd {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .thresholds {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
  }

  .th {
    flex: 1 1 5.5rem;
    padding: 0.5rem 0.65rem;
    background: var(--paper-warm);
  }
  .th b {
    display: block;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .th span {
    font-size: 0.76rem;
    color: var(--ink-soft);
  }

  .chart-wrap { margin: 0.4rem 0 1.3rem; }

  .market {
    padding: 0.75rem 0.95rem;
    margin: 0 0 1.2rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--pencil);
    font-size: 0.9rem;
  }
  .market-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.3rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  .market-top .book {
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .market-top .juice { color: var(--ink-soft); font-size: 0.84rem; }
  .market-lines {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.3rem;
    padding-bottom: 0.55rem;
    margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
  }
  .market .ev { margin-left: auto; font-weight: 600; }
  .market .ev.pos { color: var(--pencil); }
  .market .ev.neg { color: var(--ink-soft); }
  .market-cmp {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 1.3rem;
  }
  .market b { font-weight: 600; }
  .market .gap { margin-left: auto; color: var(--pencil); font-weight: 600; }
  .market .none { color: var(--ink-soft); }

  .caption {
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0 0 1rem;
  }

  /* ---------- empty ---------- */

  .empty {
    padding: 3.5rem 0 2rem;
    max-width: 44ch;
  }
  .empty h2 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.6rem;
  }
  .empty p { margin: 0 0 0.9rem; color: var(--ink-soft); }
  .empty pre {
    font-family: inherit;
    font-weight: 600;
    background: var(--paper-warm);
    padding: 0.7rem 0.9rem;
    margin: 0;
    overflow-x: auto;
    font-size: 0.9rem;
  }

  .card {
    margin: 1.6rem 0 0;
    padding: 0.9rem 1.05rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--bar);
  }
  .card h2 {
    margin: 0 0 0.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.4rem;
    font-size: 0.88rem;
  }
  .card-row + .card-row { margin-top: 0.35rem; }
  .card b { font-weight: 600; }
  .card .note {
    margin: 0.6rem 0 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 56ch;
  }
  .card .headline { color: var(--pencil); font-weight: 600; }

  .calc {
    margin: 2rem 0 0;
    padding: 1.05rem 1.15rem;
    background: var(--paper-warm);
    border-left: 3px solid var(--ink);
  }
  .calc h2 {
    margin: 0 0 0.15rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .calc .sub {
    margin: 0 0 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-soft);
    max-width: 54ch;
  }
  .calc-in {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 0.9rem;
    align-items: flex-end;
  }
  .fld { display: flex; flex-direction: column; gap: 0.2rem; }
  .fld label { font-size: 0.76rem; color: var(--ink-soft); }
  .fld input, .fld select {
    font: inherit;
    font-size: 0.92rem;
    font-variant-numeric: tabular-nums;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    border-radius: 0;
  }
  .fld input:focus, .fld select:focus {
    outline: 2px solid var(--pencil);
    outline-offset: -1px;
  }
  .fld input[type=text] { width: 11rem; }
  .fld input[type=number] { width: 5.2rem; }

  .calc-out { margin-top: 1rem; font-size: 0.9rem; }
  .calc-out .line {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.3rem;
    padding: 0.4rem 0;
    border-top: 1px solid var(--rule);
  }
  .calc-out b { font-weight: 600; }
  .calc-out .verdict {
    margin: 0.7rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    max-width: 58ch;
  }
  .calc-out .shop {
    margin-top: 0.7rem;
    padding: 0.5rem 0.7rem;
    background: var(--paper);
    border-left: 3px solid var(--pencil);
    font-size: 0.86rem;
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
    max-width: 52ch;
  }

  @media (max-width: 40rem) {
    .entry-head {
      grid-template-columns: minmax(0, 1fr) auto;
      row-gap: 0.55rem;
    }
    .strip { grid-column: 1 / -1; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .entry-head { transition: background 120ms ease; }
  }
</style>
</head>

const MAX_K = 16;
let state = { data: null, card: null, sort: "proj", open: new Set() };

/* ---------- helpers ---------- */

const fmt1 = n => n.toFixed(1);
const pct = n => Math.round(n * 100) + "%";

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });
}

function tailProb(pmf, n) {
  let s = 0;
  for (let i = n; i < pmf.length; i++) s += pmf[i];
  return s;
}

/* ---------- distribution graphics ---------- */

// Compact strip shown on every row. Red tick marks the projection.
function strip(pmf, mean, line) {
  const W = 168, H = 40, n = MAX_K + 1, bw = W / n, peak = Math.max(...pmf);
  let bars = "";
  for (let i = 0; i < n; i++) {
    const h = Math.max(1, (pmf[i] / peak) * (H - 6));
    bars += `<rect x="${(i * bw + 0.6).toFixed(2)}" y="${(H - h).toFixed(2)}" ` +
            `width="${(bw - 1.2).toFixed(2)}" height="${h.toFixed(2)}" fill="var(--bar)" ` +
            `opacity="${(0.35 + 0.65 * (pmf[i] / peak)).toFixed(2)}"/>`;
  }
  const x = (mean + 0.5) * bw;
  let book = "";
  if (line != null) {
    const lx = (line + 1) * bw;
    book = `<line x1="${lx.toFixed(2)}" y1="0" x2="${lx.toFixed(2)}" y2="${H}" ` +
           `stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 2" opacity="0.65"/>`;
  }
  return `<svg class="strip" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ` +
         `role="img" aria-label="Distribution of likely strikeout totals">` +
         bars + book +
         `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${H}" ` +
         `stroke="var(--pencil)" stroke-width="1.5"/></svg>`;
}

// Full chart shown when a row is expanded.
function chart(pmf, mean, line) {
  const W = 560, H = 150, AX = 22, n = MAX_K + 1;
  const bw = W / n, peak = Math.max(...pmf), plot = H - AX;
  let bars = "", ticks = "";
  for (let i = 0; i < n; i++) {
    const h = Math.max(1, (pmf[i] / peak) * (plot - 8));
    bars += `<rect x="${(i * bw + 1).toFixed(2)}" y="${(plot - h).toFixed(2)}" ` +
            `width="${(bw - 2).toFixed(2)}" height="${h.toFixed(2)}" ` +
            `fill="var(--bar)" opacity="${(0.3 + 0.7 * (pmf[i] / peak)).toFixed(2)}"/>`;
    if (i % 2 === 0) {
      ticks += `<text x="${(i * bw + bw / 2).toFixed(2)}" y="${H - 6}" ` +
               `text-anchor="middle" font-size="11" fill="var(--ink-soft)">${i}</text>`;
    }
  }
  const x = (mean + 0.5) * bw;
  let book = "";
  if (line != null) {
    const lx = (line + 1) * bw;
    book = `<line x1="${lx.toFixed(2)}" y1="0" x2="${lx.toFixed(2)}" y2="${plot}" ` +
           `stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>`;
  }
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" ` +
         `role="img" aria-label="Probability of each strikeout total">` +
         bars + book +
         `<line x1="0" y1="${plot}" x2="${W}" y2="${plot}" stroke="var(--rule)"/>` +
         `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${plot}" ` +
         `stroke="var(--pencil)" stroke-width="1.5"/>` +
         ticks + `</svg>`;
}

/* ---------- rendering ---------- */

function detail(s) {
  const base = Math.round(s.proj_k);
  const lines = [base - 1, base, base + 1].filter(v => v >= 1);
  const cells = lines.map(v =>
    `<div class="th"><b>${pct(tailProb(s.pmf, v))}</b><span>${v} or more</span></div>`
  ).join("");

  const m = s.market;
  const price = p => (p > 0 ? "+" : "") + p;
  const evPct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + "%";
  const best = m && (m.best_side === "Over" ? m.best_over : m.best_under);

  const mkt = m
    ? `<div class="market">
         <div class="market-lines">
           <span>Market line <b>${m.line}</b></span>
           <span>My line <b>${m.model_line ?? "—"}</b></span>
           <span class="juice">${m.books} book${m.books === 1 ? "" : "s"},
             ${pct(m.avg_vig)} margin${m.book_spread > 0.05
               ? `, disagreeing by ${Math.round(m.book_spread * 100)} pts` : ""}</span>
         </div>
         <div class="market-top">
           <span>Market <b>${pct(m.consensus_over)}</b></span>
           <span>This model <b>${pct(m.model_over)}</b></span>
           <span class="gap">${m.edge > 0 ? "+" : ""}${Math.round(m.edge * 100)} pts</span>
         </div>
         <div class="market-cmp">
           <span>Best ${m.best_side.toLowerCase()} <b>${price(best.price)}</b>
             at ${best.book}</span>
           <span class="ev ${m.best_ev > 0 ? "pos" : "neg"}">${evPct(m.best_ev)} by my numbers</span>
         </div>
       </div>`
    : `<div class="market"><span class="none">No strikeout line posted for this start.</span></div>`;

  return `
    <div class="detail">
      <div class="chart-wrap">${chart(s.pmf, s.proj_k, m ? m.line : null)}</div>
      ${mkt}
      ${m ? `<p class="caption">Both percentages are the chance of clearing
        ${m.line}, with the books' margin stripped out so they're comparable.
        The last figure is what my numbers say that price is worth — which is
        only as good as the model, and the model hasn't been graded yet.</p>` : ""}
      <p class="caption">Height is the chance of that exact total. The red line is
      the projection${m ? ", the dashed line is the book's" : ""} — note how little
      of the distribution actually sits on any one number.</p>
      <div class="thresholds">${cells}</div>
      <dl class="detail-grid">
        <div class="fact"><dt>Batters faced</dt><dd>${fmt1(s.proj_bf)}</dd></div>
        <div class="fact"><dt>Matchup K rate</dt><dd>${pct(s.k_rate)}</dd></div>
        <div class="fact"><dt>His K rate</dt><dd>${pct(s.pitcher_k_pct)}</dd></div>
        <div class="fact"><dt>Their K rate</dt><dd>${pct(s.opp_k_pct)}</dd></div>
        <div class="fact"><dt>Lineup</dt><dd>${s.lineup_confirmed ? "Posted" : "Projected"}</dd></div>
      </dl>
    </div>`;
}

function scorecard() {
  const c = state.card;
  if (!c || !c.starts) {
    return `<div class="card"><h2>Accuracy</h2>
      <p class="note">Nothing graded yet. Each finished day gets scored against
      the real results; come back after a couple of weeks.</p></div>`;
  }

  const m = c.market;
  const rate = m && m.win_rate != null ? m.win_rate : null;
  const thin = c.starts < 150;

  return `<div class="card">
    <h2>Accuracy over ${c.days} day${c.days === 1 ? "" : "s"},
        ${c.starts} start${c.starts === 1 ? "" : "s"}</h2>
    <div class="card-row">
      <span>My error <b>${c.mae_model}</b></span>
      <span>Season-average baseline <b>${c.mae_naive}</b></span>
      ${m ? `<span>The books <b>${m.mae_book}</b></span>` : ""}
    </div>
    <div class="card-row">
      <span>Strikeout bias <b>${c.bias_k > 0 ? "+" : ""}${c.bias_k}</b></span>
      <span>Batters faced <b>${c.bias_bf > 0 ? "+" : ""}${c.bias_bf}</b></span>
      <span>Real spread <b>${c.sd_actual}</b></span>
    </div>
    ${rate != null ? `<div class="card-row"><span class="headline">
      Disagreed with the books by a full strikeout ${m.disagreements} times,
      and was closer on ${Math.round(rate * 100)}% of them.</span></div>` : ""}
    <p class="note">${thin
      ? `Under 150 starts, a gap this size is indistinguishable from luck. Keep collecting.`
      : (rate != null && rate <= 0.5
        ? `Losing the disagreements. The gaps flagged on the slate are this model's
           blind spots rather than anything the market missed.`
        : `Ahead of the baseline. The disagreement rate is the number that decides
           whether the flagged gaps mean anything.`)}</p>
  </div>`;
}

/* ---------- price checker ---------- */

const toDecimal = p => (p > 0 ? 1 + p / 100 : 1 + 100 / -p);
const breakEven = p => 1 / toDecimal(p);
const fmtPrice = p => (p > 0 ? "+" : "") + p;

function calcPanel() {
  const names = state.data
    ? state.data.starters.map(s => s.pitcher).sort()
    : [];
  return `<div class="calc">
    <h2>Check a price</h2>
    <p class="sub">Enter a price you've been offered. This shows the arithmetic:
      what the price needs to be worth taking, what the market thinks, and
      whether a better number exists elsewhere.</p>
    <div class="calc-in">
      <div class="fld">
        <label for="c-name">Pitcher</label>
        <input id="c-name" type="text" list="c-list" placeholder="Any name" autocomplete="off">
        <datalist id="c-list">${names.map(n => `<option value="${n}">`).join("")}</datalist>
      </div>
      <div class="fld">
        <label for="c-side">Side</label>
        <select id="c-side"><option>Over</option><option>Under</option></select>
      </div>
      <div class="fld">
        <label for="c-line">Line</label>
        <input id="c-line" type="number" step="0.5" placeholder="5.5">
      </div>
      <div class="fld">
        <label for="c-odds">Odds</label>
        <input id="c-odds" type="number" step="5" placeholder="-115">
      </div>
      <div class="fld">
        <label for="c-other">Other side <span style="opacity:.6">(optional)</span></label>
        <input id="c-other" type="number" step="5" placeholder="-105">
      </div>
    </div>
    <div class="calc-out" id="c-out"></div>
  </div>`;
}

function runCalc() {
  const name = document.getElementById("c-name").value.trim();
  const side = document.getElementById("c-side").value;
  const line = parseFloat(document.getElementById("c-line").value);
  const odds = parseFloat(document.getElementById("c-odds").value);
  const other = parseFloat(document.getElementById("c-other").value);
  const out = document.getElementById("c-out");

  if (!odds || Math.abs(odds) < 100) { out.innerHTML = ""; return; }

  const be = breakEven(odds);
  let html = `<div class="line">
      <span>Pays <b>${fmtPrice(odds)}</b></span>
      <span>Needs <b>${(be * 100).toFixed(1)}%</b> to break even</span>
    </div>`;

  // If both sides given, the vig can be stripped without any model at all.
  if (other && Math.abs(other) >= 100) {
    const a = breakEven(odds), b = breakEven(other);
    const fair = a / (a + b);
    html += `<div class="line">
      <span>Fair after vig <b>${(fair * 100).toFixed(1)}%</b></span>
      <span>Book's margin <b>${((a + b - 1) * 100).toFixed(1)}%</b></span>
    </div>`;
  }

  // Anything below needs the pitcher to be on today's slate.
  const s = state.data && state.data.starters.find(
    x => x.pitcher.toLowerCase() === name.toLowerCase());

  if (s && !isNaN(line)) {
    const threshold = Math.floor(line) + 1;
    const pOver = s.pmf.slice(threshold).reduce((a, b) => a + b, 0);
    const mine = side === "Over" ? pOver : 1 - pOver;
    const ev = mine * (toDecimal(odds) - 1) - (1 - mine);

    html += `<div class="line">
        <span>My model <b>${(mine * 100).toFixed(1)}%</b></span>
        <span>Edge over break-even
          <b>${((mine - be) * 100).toFixed(1)} pts</b></span>
        <span>EV <b>${(ev * 100).toFixed(1)}%</b></span>
      </div>`;

    const m = s.market;
    if (m) {
      const mkt = side === "Over" ? m.consensus_over : 1 - m.consensus_over;
      html += `<div class="line">
          <span>Market line <b>${m.line}</b></span>
          <span>Market <b>${(mkt * 100).toFixed(1)}%</b>
            across ${m.books} book${m.books === 1 ? "" : "s"}</span>
        </div>`;

      // Line shopping - the one edge that doesn't depend on any model.
      const best = side === "Over" ? m.best_over : m.best_under;
      if (best && m.line === line) {
        const gain = (toDecimal(best.price) - toDecimal(odds)) * 100;
        html += gain > 0.5
          ? `<div class="shop"><b>${best.book} has ${fmtPrice(best.price)}</b>
             on the same line — about $${gain.toFixed(0)} more per $100 staked,
             for the same bet. This part doesn't depend on the model being right.</div>`
          : `<div class="shop">That's the best price I found across
             ${m.books} book${m.books === 1 ? "" : "s"}.</div>`;
      }
    }

    html += `<p class="verdict">The model has not been graded against results
      yet, so treat the EV figure as a disagreement with the market rather
      than an edge over it. The break-even and vig figures above are just
      arithmetic and hold regardless.</p>`;
  } else if (name) {
    html += `<p class="verdict">${name} isn't on today's slate, so there's no
      model number for him — but the break-even${other ? " and vig" : ""}
      arithmetic above applies to any bet in any sport.</p>`;
  } else {
    html += `<p class="verdict">Add a pitcher from today's slate and a line to
      compare against the model and check for a better price.</p>`;
  }

  out.innerHTML = html;
}

function render() {
  const d = state.data;
  document.getElementById("date").textContent = prettyDate(d.date);

  const t = new Date(d.generated_at);
  document.getElementById("meta").innerHTML =
    `${d.starters.length} starters<br>built ${t.toLocaleTimeString(undefined,
      { hour: "numeric", minute: "2-digit" })}`;

  document.getElementById("notice").innerHTML = d.sample
    ? `<div class="notice">Showing a sample slate — these are made-up numbers, not
       today's games. Run <code>python build_projections.py</code> to write a real
       <code>projections.json</code> next to this page.</div>`
    : "";

  const rows = [...d.starters].sort(
    state.sort === "proj"
      ? (a, b) => b.proj_k - a.proj_k
      : (a, b) => a.game_time.localeCompare(b.game_time) || b.proj_k - a.proj_k
  );

  document.getElementById("body").innerHTML = `
    <div class="controls">
      <span>Sort by</span>
      <button data-sort="proj" aria-pressed="${state.sort === "proj"}">projection</button>
      <span aria-hidden="true">·</span>
      <button data-sort="time" aria-pressed="${state.sort === "time"}">first pitch</button>
    </div>
    <div class="ledger">
      ${rows.map(s => {
        const key = s.pitcher + s.opponent;
        const open = state.open.has(key);
        const vs = s.home ? "vs" : "at";
        return `
        <div class="entry" data-key="${key}" ${open ? "open-detail" : ""}>
          <button class="entry-head" aria-expanded="${open}">
            <span class="who">
              <span class="name">${s.pitcher}</span>
              <span class="matchup">${s.team} ${vs} ${s.opponent} · ${s.venue} · ${s.game_time}</span>
            </span>
            <span class="proj">${fmt1(s.proj_k)}</span>
            ${strip(s.pmf, s.proj_k, s.market ? s.market.line : null)}
          </button>
          ${detail(s)}
        </div>`;
      }).join("")}
    </div>`;

  document.getElementById("card").innerHTML = scorecard();
  document.getElementById("calc").innerHTML = calcPanel();
  ["c-name", "c-side", "c-line", "c-odds", "c-other"].forEach(id =>
    document.getElementById(id).addEventListener("input", runCalc));

  document.getElementById("footer").innerHTML =
    `Projections combine each pitcher's strikeout rate with the opposing lineup's,
     then apply it across the batters he's expected to face. A start has a standard
     deviation of roughly two and a half strikeouts, so treat any single number as
     the middle of a wide range.`;

  document.querySelectorAll(".controls button").forEach(b =>
    b.onclick = () => { state.sort = b.dataset.sort; render(); });

  document.querySelectorAll(".entry-head").forEach(b => b.onclick = () => {
    const entry = b.closest(".entry"), key = entry.dataset.key;
    state.open.has(key) ? state.open.delete(key) : state.open.add(key);
    entry.toggleAttribute("open-detail");
    b.setAttribute("aria-expanded", state.open.has(key));
  });
}

function empty(reason) {
  document.getElementById("body").innerHTML = `
    <div class="empty">
      <h2>No slate loaded</h2>
      <p>${reason}</p>
      <p>Build today's file, then serve this folder so the page can read it:</p>
      <pre>python build_projections.py
python -m http.server 8000</pre>
      <p>Then open localhost:8000 in your browser. Opening the file directly
         won't work — browsers block pages on <code>file://</code> from reading
         other local files.</p>
    </div>`;
}

fetch("scorecard.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : null)
  .then(c => { state.card = c; })
  .catch(() => {})
  .then(() => fetch("projections.json", { cache: "no-store" }))
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { state.data = d; render(); })
  .catch(() => {
    if (SAMPLE) { state.data = SAMPLE; render(); }
    else empty("Couldn't find projections.json in this folder.");
  });
</script>
